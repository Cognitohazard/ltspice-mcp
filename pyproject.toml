[project]
name = "ltspice-mcp"
version = "0.1.0"
description = "MCP server for LTSpice circuit simulation"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "spicelib>=1.4.9",
    "tomlkit>=0.14.0",
]

[project.scripts]
ltspice-mcp = "ltspice_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltspice_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
