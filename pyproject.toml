[project]
name = "ltspice-mcp"
version = "0.1.1"
description = "MCP server for LTSpice circuit simulation"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "spicelib>=1.4.9,<2.0",
    "tomlkit>=0.14.0,<1.0",
]

[project.scripts]
ltspice-mcp = "ltspice_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltspice_mcp"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # async correctness
    "TRY",   # exception handling
    "PERF",  # performance anti-patterns
    "PT",    # pytest style
]
ignore = [
    "E501",    # line length (handled by formatter)
    "TRY003",  # long exception messages are fine for a CLI tool
    "TRY300",  # return-in-try is fine when the logic reads better inline
    "TRY301",  # raise-within-try is used intentionally for re-raising with context
    "TRY400",  # logger.error in except is acceptable
    "PERF401", # list-comprehension rewrites often hurt readability for filtering+appending
    "PT018",   # compound assertions are acceptable when testing related properties
]

[tool.ruff.lint.isort]
known-first-party = ["ltspice_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short --cov=ltspice_mcp --cov-fail-under=60"
