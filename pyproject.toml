[project]
name = "ltspice-mcp"
dynamic = ["version"]
description = "SPICE simulation through an MCP server and an in-process Python API for LTspice and ngspice. Supports schematic editing, sweeps, Monte Carlo analysis, and structured measurements."
keywords = ["mcp", "ltspice", "spice", "ngspice", "qspice", "circuit-simulation", "eda", "claude", "anthropic", "model-context-protocol", "ai", "python-api", "analog", "monte-carlo"]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.0,<5.0",
    # No [cli] extra: nothing here imports typer or rich, and that extra pulls
    # both into every install for the `mcp` command-line tool we never invoke.
    "mcp>=2.3,<3.0",
    "numpy>=1.26,<3.0",
    # Direct use (scoped simulator kill, job owner-pid liveness); also a
    # spicelib transitive, so this adds no new install weight.
    "psutil>=5.9,<8.0",
    # 2.9 is the floor for BeforeValidator(json_schema_input_type=...), which is
    # what lets a coerced argument (verify_circuit's boolean `render`) advertise
    # the spelling it accepts instead of only accepting it.
    "pydantic>=2.9,<3.0",
    "rapidfuzz>=3.0,<4.0",
    # Rasterizes a rendered schematic or plot to PNG, the only image an
    # assistant can see. Prebuilt abi3 wheels for Windows, macOS and Linux
    # (glibc and musl), and no native library to load (see lib/raster.py).
    "resvg-py>=0.5,<0.6",
    "scipy>=1.12,<2.0",
    # Capped below 1.6 (tested range). spicelib 1.6 refactored the editor model:
    # .PARAM values now come back typed (e.g. 1k -> a number) rather than as
    # strings, which breaks the parameter read/edit path. (The 1.6 component-
    # construction break — a lazy attributes property on a from-scratch
    # component — is already handled in code via AscComponent.) Without a ceiling
    # a plain `uvx ltspice-mcp` resolves to the newest in range and ships an
    # untested spicelib to users. Lift once the parameter path is migrated.
    "spicelib>=1.4.9,<1.6",
    "tomlkit>=0.14.0,<1.0",
]

[project.optional-dependencies]
# Empty: resvg-py, which this extra used to add, is a dependency now. Kept so
# that a launch line naming it (uvx --from 'ltspice-mcp[raster]'), which
# earlier releases needed for PNG, still resolves.
raster = []

[project.urls]
Homepage = "https://github.com/cognitohazard/ltspice-mcp"
Repository = "https://github.com/cognitohazard/ltspice-mcp"
Issues = "https://github.com/cognitohazard/ltspice-mcp/issues"

[project.scripts]
ltspice-mcp = "ltspice_mcp.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# Everything under the package directory ships, including the runtime data in
# src/ltspice_mcp/assets/ (the packaged SPICE guide and the bundled widget
# assets) — the server reads those at run time, so they are not optional.
packages = ["src/ltspice_mcp"]

# An explicit list, because the default sdist ships everything git tracks: the
# repo's development surface (CI workflows, the maintainer's notes, test
# fixtures, packaging scratch) is not something a source install needs.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "skills",
    "README.md",
    "CHANGELOG.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSE",
    "SECURITY.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    # cairosvg, the rasterizer used when resvg-py cannot be imported: a dev
    # requirement, so both PNG paths run in CI.
    "cairosvg>=2.7,<3.0",
    "hypothesis>=6.152.4",
    # Reads LTspice's own drawing of schematic text in the layout tests.
    "pillow>=11",
    "pyright>=1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # async correctness
    "TRY",   # exception handling
    "PERF",  # performance anti-patterns
    "PT",    # pytest style
    "TID251", # banned names (see banned-api below)
]
ignore = [
    "E501",    # line length (handled by formatter)
    "TRY003",  # a long exception message is the caller-facing text here
    "TRY300",  # return-in-try is fine when the logic reads better inline
    "TRY301",  # raise-within-try is used intentionally for re-raising with context
    "TRY400",  # logger.error in except is acceptable
    "PERF401", # list-comprehension rewrites often hurt readability for filtering+appending
    "PT018",   # compound assertions are acceptable when testing related properties
]
# Scientific/EE notation characters used intentionally in docstrings, comments,
# and string literals: Greek sigma for standard deviation, multiplication and
# centred dot for product notation (W·L, V·µm), proper minus sign for
# inequality contexts (−3σ ≤ x ≤ 3σ), proportional-to symbol, micro sign,
# square root for Pelgrom's law, and degree sign for phase margins.
allowed-confusables = ["σ", "×", "·", "−", "∝", "µ", "√", "°"]

[tool.ruff.lint.isort]
known-first-party = ["ltspice_mcp"]

# Names that answer a question only their owner may ask, and names a
# replacement now answers for. Ruff refuses a use anywhere else. A use that is
# allowed carries `# noqa: TID251 - <reason>` on its line, and Ruff flags a
# marker whose line no longer uses a banned name (RUF100), so the allowed uses
# only shrink. A name imported into another module is banned there too.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ltspice_mcp.lib.services.find_trace".msg = "Resolve a caller's signal with services.resolve_signal, which also reads a node pair."
"ltspice_mcp.lib.format.parse_plain_value".msg = "Read a value a simulator runs with format.parse_spice_value; the plain reader only tells a number from a name."
"ltspice_mcp.lib.variations.parse_plain_value".msg = "Read a value a simulator runs with format.parse_spice_value; the plain reader only tells a number from a name."
"ltspice_mcp.lib.simulator_build.is_cp1252_ltspice_executable".msg = "Ask simulator_build.ltspice_before_24, which also reads the build a run reported."
"ltspice_mcp.lib.job_lifecycle.runs_terminal".msg = "Ask services.runs_unready, services.case_unreadable or job_lifecycle.runs_done whether runs can be read."
"ltspice_mcp.lib.experiment_store.load_job".msg = "Resolve a job through the registry (JobRegistry.get_or_load), which reconciles a record another process owns."
"ltspice_mcp.lib.experiment_store.load_job_from_path".msg = "Resolve a job through the registry (JobRegistry.get_or_load), which reconciles a record another process owns."
"ltspice_mcp.lib.recipes.validate_recipe".msg = "Validate a request's recipe with analyze.recipe_of_request, which also checks the source labels it names."
"ltspice_mcp.tools.analyze.validate_recipe".msg = "Validate a request's recipe with analyze.recipe_of_request, which also checks the source labels it names."
"ltspice_mcp.tools._base.held_to_cap".msg = "Import held_to_cap from ltspice_mcp.lib.format, which owns it."
"ltspice_mcp.lib.spice_lex.cards_from_path".msg = "Read a deck with spice_lex.lex_deck, or spice_lex.lex_for_edit for an edit; a file's every card reads its title and the cards after .END as cards."

[tool.ruff.lint.per-file-ignores]
# Tests exercise a banned name directly.
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
# A wedged test used to consume the whole CI job and report nothing but "the
# operation was canceled" fifteen minutes later. pytest arms these per test
# (setup, call and teardown), so a hang now dumps every thread's stack and
# exits with the frame it is stuck in. Well above the longest legitimate wait
# in the suite (a live simulator job may wait 120s by design) and well below
# the job timeout, so the dump still reaches the log.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
