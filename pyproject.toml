[project]
name = "ltspice-mcp"
dynamic = ["version"]
description = "MCP server for LTspice: lets Claude and other LLMs edit schematics, run SPICE simulations, and parse results."
keywords = ["mcp", "ltspice", "spice", "ngspice", "qspice", "circuit-simulation", "eda", "claude", "anthropic", "model-context-protocol", "ai"]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.0,<5.0",
    "mcp[cli]>=1.27.0,<2.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.7,<3.0",
    "rapidfuzz>=3.0,<4.0",
    "scipy>=1.12,<2.0",
    "spicelib>=1.4.9,<2.0",
    "tomlkit>=0.14.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/cognitohazard/ltspice-mcp"
Repository = "https://github.com/cognitohazard/ltspice-mcp"
Issues = "https://github.com/cognitohazard/ltspice-mcp/issues"

[project.scripts]
ltspice-mcp = "ltspice_mcp.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ltspice_mcp"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "pyright>=1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # async correctness
    "TRY",   # exception handling
    "PERF",  # performance anti-patterns
    "PT",    # pytest style
]
ignore = [
    "E501",    # line length (handled by formatter)
    "TRY003",  # long exception messages are fine for a CLI tool
    "TRY300",  # return-in-try is fine when the logic reads better inline
    "TRY301",  # raise-within-try is used intentionally for re-raising with context
    "TRY400",  # logger.error in except is acceptable
    "PERF401", # list-comprehension rewrites often hurt readability for filtering+appending
    "PT018",   # compound assertions are acceptable when testing related properties
]
# Scientific/EE notation characters used intentionally in docstrings, comments,
# and string literals: Greek sigma for standard deviation, multiplication and
# centred dot for product notation (W·L, V·µm), proper minus sign for
# inequality contexts (−3σ ≤ x ≤ 3σ), proportional-to symbol, micro sign,
# square root for Pelgrom's law, and degree sign for phase margins.
allowed-confusables = ["σ", "×", "·", "−", "∝", "µ", "√", "°"]

[tool.ruff.lint.isort]
known-first-party = ["ltspice_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short --cov=ltspice_mcp --cov-fail-under=80"
