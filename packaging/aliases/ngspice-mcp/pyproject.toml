[project]
name = "ngspice-mcp"
dynamic = ["version"]
description = "Alias for ltspice-mcp: a SPICE circuit-simulation MCP server (LTspice/ngspice). Installs and runs ltspice-mcp."
keywords = ["mcp", "spice", "ngspice", "ltspice", "circuit-simulation", "eda", "model-context-protocol"]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Local/dev floor only: at release, publish-aliases.yml rewrites this to an
# exact ``ltspice-mcp==<tag>`` pin (and waits for that version on PyPI), so a
# published alias can never resolve an older canonical package.
dependencies = ["ltspice-mcp>=0.5.0"]

[project.urls]
Homepage = "https://github.com/cognitohazard/ltspice-mcp"
Repository = "https://github.com/cognitohazard/ltspice-mcp"
Issues = "https://github.com/cognitohazard/ltspice-mcp/issues"

[project.scripts]
ngspice-mcp = "ngspice_mcp:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version tracks the canonical ltspice-mcp release: derived from the repo's git
# tag (same tag as ltspice-mcp), so all packages share one version. ``root``
# points at the repo root three levels up from this subdir.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../../.." }

[tool.hatch.build.targets.wheel]
packages = ["ngspice_mcp"]
