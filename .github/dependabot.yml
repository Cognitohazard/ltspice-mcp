version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # spicelib is pinned <1.6 on purpose: 1.6 retypes .PARAM values
      # (float_unit) and refactored the component model, which breaks our
      # parameter read/edit and diff_circuit paths. See the pin comment in
      # pyproject.toml and .claude/plans/spicelib_dependency_2026_06_18.md.
      # Allow 1.5.x patches through (security/bugfix); never auto-propose 1.6+.
      - dependency-name: "spicelib"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
