name: Publish aliases to PyPI

# Thin alias packages (circuit-mcp, ngspice-mcp) under packaging/aliases/.
# They share the canonical version (hatch-vcs reads the same git tag) and ride
# the same `v*` release tag as publish.yml, so every release ships all three
# packages at one version. skip-existing keeps it idempotent — an alias whose
# version already exists on PyPI is skipped, not re-published.
#
# workflow_dispatch is kept for catch-up: publish a single alias whose trusted
# publisher was registered after a release (run it against that release's tag).
#
# Uses PyPI Trusted Publishing (OIDC), same mechanism as publish.yml. Each alias
# is a separate PyPI project and needs its own pending/trusted publisher (owner
# cognitohazard, repo ltspice-mcp, workflow publish-aliases.yml, env pypi).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      alias:
        description: "Which alias package to publish"
        type: choice
        default: all
        options:
          - all
          - circuit-mcp
          - ngspice-mcp

permissions:
  contents: read

jobs:
  # Release gate: runs the exact same reusable checks workflow as CI and
  # publish.yml (lint + pyright + the real-ngspice e2e tier + dependency audit),
  # so the aliases can't publish when checks fail and the gates cannot drift.
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25  # includes up to ~15 min waiting for the canonical upload
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # On a release tag, publish every alias. On manual dispatch, publish the
        # chosen one (default 'all'). Each alias is a separate PyPI project with
        # its own trusted publisher, so one can ship before the other's publisher
        # is registered (e.g. circuit-mcp first).
        alias: ${{ (github.event_name == 'workflow_dispatch' && inputs.alias != 'all') && fromJSON(format('["{0}"]', inputs.alias)) || fromJSON('["circuit-mcp", "ngspice-mcp"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history + tags to resolve the version
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # All three packages ship at one version per release tag; the alias's
      # runtime dependency is pinned to exactly that version at build time (the
      # tracked pyproject keeps only a floor, for local/dev installs). Without
      # the pin, an alias release could legally resolve an older ltspice-mcp —
      # new alias version, stale server code.
      - name: Resolve release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "Ref '$GITHUB_REF_NAME' is not a release tag; refusing to pin and publish." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The exact pin makes the alias uninstallable until the canonical package
      # exists, so wait for it: if the canonical upload failed, the aliases must
      # not publish at all rather than ship pointing at a version that never
      # lands (or silently resolving an older one).
      - name: Wait for ltspice-mcp ${{ steps.version.outputs.version }} on PyPI
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/ltspice-mcp/${VERSION}/json" >/dev/null 2>&1; then
              echo "ltspice-mcp ${VERSION} is available on PyPI."
              exit 0
            fi
            echo "Attempt ${attempt}/30: ltspice-mcp ${VERSION} not on PyPI yet; retrying in 30s."
            sleep 30
          done
          echo "ltspice-mcp ${VERSION} never appeared on PyPI; aborting alias publish." >&2
          exit 1

      - name: Pin ltspice-mcp dependency to ${{ steps.version.outputs.version }}
        working-directory: packaging/aliases/${{ matrix.alias }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|\"ltspice-mcp>=[^\"]*\"|\"ltspice-mcp==${VERSION}\"|" pyproject.toml
          grep -F "ltspice-mcp==${VERSION}" pyproject.toml

      # The pin edit dirties the working tree, which would make hatch-vcs derive
      # a +dirty local version PyPI rejects — so the version is supplied
      # explicitly instead of read from git state.
      - name: Build ${{ matrix.alias }}
        working-directory: packaging/aliases/${{ matrix.alias }}
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: uv build --out-dir dist

      - name: Verify metadata
        run: |
          uvx twine check --strict packaging/aliases/${{ matrix.alias }}/dist/*
          # The built wheel must depend on exactly the co-released canonical
          # version — catches any regression in the pin step.
          VERSION="${{ steps.version.outputs.version }}"
          unzip -p packaging/aliases/${{ matrix.alias }}/dist/*.whl '*/METADATA' \
            | grep -F "Requires-Dist: ltspice-mcp==${VERSION}"

      # Pinned to the v1.14.0 commit SHA (privileged OIDC step — must not follow
      # a mutable ref). Matches publish.yml; Dependabot bumps both together.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: packaging/aliases/${{ matrix.alias }}/dist
          skip-existing: true
