name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # A dry run against TestPyPI: exercises the build, the metadata check and
  # trusted publishing without spending a release tag. The version is given
  # explicitly because a non-tag ref would derive a local version PyPI rejects.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and upload to TestPyPI (e.g. 0.6.0rc1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release gate: runs the exact same reusable checks workflow as CI
  # (lint + pyright + the real-ngspice e2e tier + dependency audit),
  # so the release gate and the CI gate cannot drift.
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history to resolve the tag
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        if: github.event_name != 'workflow_dispatch'
        run: uv build

      # A dry run has no tag to derive the version from.
      - name: Build package for the dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: uv build

      - name: Verify metadata
        run: uv run --with twine python -m twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A dispatch publishes to TestPyPI under its own environment (and so its
    # own trusted-publisher binding); a tag push publishes to PyPI.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to the v1.14.2 commit SHA. The publish step is privileged
      # (OIDC → PyPI Trusted Publishing), so it must not follow a mutable
      # ref like release/v1. Dependabot bumps this with an updated comment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
