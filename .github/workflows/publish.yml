name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Mirrors ci.yml's check job — a release must clear at least the same
  # gate as an ordinary push (pyright + the real-ngspice e2e tier included).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run pyright

      - name: Install ngspice (enables the real-ngspice e2e tier)
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Run tests
        run: uv run pytest tests/ -v

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export locked runtime dependencies
        run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project --output-file requirements.txt

      - name: Audit locked dependencies
        run: uv run --with pip-audit python -m pip_audit -r requirements.txt --no-deps --strict

  build:
    needs: [test, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs needs full history to resolve the tag
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Verify metadata
        run: uv run --with twine python -m twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to the v1.14.0 commit SHA. The publish step is privileged
      # (OIDC → PyPI Trusted Publishing), so it must not follow a mutable
      # ref like release/v1. Dependabot bumps this with an updated comment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
