name: Checks

# Reusable checks shared by CI (every push/PR) and the publish workflow's
# release gate. Both call this file, so the two gates cannot drift.
#
# The `tier` input chooses which jobs run; ci.yml picks it per run.
#   full: every job. The default, so the release gate and every push to master
#         run all of them.
#   pr:   static, changelog, audit, the Linux suite on Python 3.12, Windows.
#   docs: static, changelog, the Linux suite on Python 3.12.
# A job a tier leaves out is skipped by its own `if`, so it still reports, as
# skipped, under the name it has in the full tier, and a required check of
# that name passes. For that reason each interpreter of the Linux suite is its
# own job with a fixed name rather than a leg of a matrix: a matrix job skipped
# by `if` reports once, under an unexpanded name, instead of once per leg.

on:
  workflow_call:
    inputs:
      tier:
        description: "Which jobs run: full, pr or docs."
        type: string
        default: full

permissions:
  contents: read

jobs:
  static:
    # Lint and type check once, not once per interpreter: ruff targets py311,
    # pyrightconfig.json pins pythonVersion 3.11, and uv.lock resolves one
    # package set for 3.11 through 3.13, so every leg of the test matrix would
    # check the same thing. Its own job, so the test legs start testing sooner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run pyright

  check:
    # The Linux suite on the matrix's middle interpreter, in every tier.
    name: check (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON: "3.12"
    steps: &linux-suite
      - name: Refuse an unknown tier
        if: inputs.tier != 'full' && inputs.tier != 'pr' && inputs.tier != 'docs'
        env:
          TIER: ${{ inputs.tier }}
        run: |
          echo "::error::unknown checks tier '$TIER' (expected full, pr or docs)"
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python ${{ env.PYTHON }}
        run: uv python pin "${{ env.PYTHON }}"

      - name: Install ngspice and cairo (the real-ngspice e2e tier and the raster tier)
        run: sudo apt-get update && sudo apt-get install -y ngspice libcairo2

      # Coverage is gated here rather than in the pytest addopts so the repo's
      # documented single-file debug commands (e.g. `uv run pytest
      # tests/test_pathutil.py`) don't fail on a whole-package coverage floor.
      # One xdist worker per core (four on a hosted runner) runs the suite in
      # under half its serial time; pytest-cov combines the workers' data
      # before the floor is checked.
      - name: Test
        run: uv run pytest tests/ -v -n auto --cov=ltspice_mcp --cov-fail-under=80

  check-py311:
    # Prove every supported interpreter, floor to ceiling. The async deadline
    # test is version-sensitive (asyncio internals shifted in 3.12), so a
    # floor-only runtime failure must not reach PyPI under
    # Requires-Python >= 3.11. Full tier only.
    name: check (3.11)
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON: "3.11"
    steps: *linux-suite

  check-py313:
    # The ceiling interpreter. Full tier only.
    name: check (3.13)
    if: inputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON: "3.13"
    steps: *linux-suite

  check-windows:
    # Windows native is a supported platform with win32-only code (the msvcrt
    # advisory-lock branch in lib/filelock.py) and Windows-aware tests that the
    # Linux matrix above never exercises. One runner on the matrix's middle
    # interpreter guards those paths — this proves platform correctness, not
    # every interpreter version.
    if: inputs.tier != 'docs'
    runs-on: windows-latest
    # The real-ngspice tests run here too, which the job's runtime has to cover.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python pin "3.12"

      # The official Windows build of ngspice, the one users install, so the
      # real-ngspice tests run on Windows as well (docs/TESTING.md). In it,
      # ngspice.exe is the GUI program, which writes no console output, and
      # ngspice_con.exe the console one; the tests and spicelib start
      # `ngspice` from PATH, so the console program is copied over the GUI
      # one. It is unpacked to C:\Spice64, where its install notes put it:
      # started by name from another folder, as the tests and the server start
      # it, ngspice-47 found no spinit in a tree unpacked elsewhere, so it
      # loaded no code models and wrote binary raw files. Its spinit loads the
      # code models by paths relative to bin and sets filetype=ascii, so the
      # tree stays whole, and the step fails unless ngspice reads it. The
      # archive is pinned by SHA-256; SourceForge publishes its SHA-1 and MD5,
      # which matched.
      - name: Install ngspice (official Windows console build)
        shell: pwsh
        env:
          NGSPICE_VERSION: "47"
          NGSPICE_SHA256: 59225971bd68cdd1199443649aa4615a9e6d684933f205ab49006a3942518f5a
        run: |
          $name = "ngspice-${env:NGSPICE_VERSION}_64.7z"
          $archive = Join-Path $env:RUNNER_TEMP $name
          curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors `
            --output $archive `
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/${env:NGSPICE_VERSION}/$name"
          if ($LASTEXITCODE -ne 0) { throw "downloading $name failed" }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:NGSPICE_SHA256) { throw "$name has SHA-256 $hash, expected $env:NGSPICE_SHA256" }
          7z x $archive "-oC:\" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "unpacking $name failed" }
          $bin = "C:\Spice64\bin"
          Copy-Item (Join-Path $bin "ngspice_con.exe") (Join-Path $bin "ngspice.exe") -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "ngspice.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "ngspice --version failed" }
          # A code model loads only through spinit: run one by name from
          # another folder, as a test does.
          $env:PATH = "$bin;$env:PATH"
          $probe = Join-Path $env:RUNNER_TEMP "ngspice-probe"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Set-Content -Path (Join-Path $probe "probe.cir") -Value @(
            "* spinit probe", "V1 1 0 1", "A1 1 2 amp", ".model amp gain(gain=2)",
            "R1 2 0 1k", ".control", "op", "print v(2)", ".endc", ".end")
          Push-Location $probe
          ngspice -b -o probe.log probe.cir | Out-Null
          Pop-Location
          $out = Get-Content -Raw (Join-Path $probe "probe.log")
          Write-Output $out
          if ($out -notmatch "v\(2\) = 2\.0") { throw "ngspice did not read its spinit" }

      # No lint step: ruff results are platform-independent and already
      # enforced by the static job — this job exists for win32 code paths.
      # No coverage gate here: the 80% floor is enforced on the Linux job, and
      # this job proves the win32 code paths, the Windows-aware tests and the
      # real-ngspice tests on Windows.
      # One xdist worker per core, as on Linux: a serial run here spent most of
      # the job's time waiting on processes starting one after another. The
      # release gate's serial run keeps the one-process test order covered.
      - name: Test
        run: uv run pytest tests/ -v -n auto

  check-macos:
    # The suite on a native macOS interpreter, on the matrix's middle
    # interpreter as on Windows. The server refuses to parse results on macOS
    # (lib/parser_bootstrap.py, docs/TESTING.md "Platforms and the release
    # gate"), so a test that fails only because of that refusal is reported as
    # skipped with the refusal as its reason (tests/parser_refusal.py). It also
    # refuses a recoverable ngspice run there, and a test of one skips
    # (needs_controlled_startup in tests/conftest.py). Everything else must
    # pass here. Full tier only.
    if: inputs.tier == 'full'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python pin "3.12"

      - name: Install ngspice and cairo (the real-ngspice e2e tier and the raster tier)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ngspice cairo

      # No coverage gate: every test that reads a result skips here, so the
      # whole-package coverage falls below the Linux floor for a reason that
      # says nothing about macOS. -ra lists every skip with its reason.
      # Homebrew's library folder is not on dyld's default search path on Apple
      # silicon, so cairocffi finds libcairo only through the fallback path. It
      # is exported inside the step because macOS removes DYLD_* variables from
      # the environment of a protected program such as /bin/bash.
      - name: Test
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          uv run pytest tests/ -v -n auto -ra

  audit:
    if: inputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export locked runtime dependencies
        run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project --output-file requirements.txt

      - name: Audit locked dependencies
        run: uv run --with pip-audit python -m pip_audit -r requirements.txt --no-deps --strict

  changelog:
    # A pull request tells users what it changed through a fragment under
    # changelog.d/ (CLAUDE.md, "Working practice"); the release renders the
    # fragments into CHANGELOG.md. `towncrier check` fails a pull request that
    # adds none. A change with nothing to tell users adds a fragment of type
    # `internal`, which the release renders as nothing. Pull requests only: a
    # push to master and the publish workflow's release gate have no base
    # branch to compare with.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs the branch against master, so master must be fetched.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check for a changelog fragment
        run: uv run towncrier check --compare-with origin/master
