[behaviour.number-grid]
summary = "The cells of the value-number grid (at the end of this file) that no other recording fills: each scale suffix in each case it can be written in, alone, with unit letters after it and with an ohm sign after it; each way of writing a mantissa (decimal, a dot at either end, an exponent, a sign, an underscore, inf, nan, a number past the largest double, a digit that is not ASCII), alone and before a suffix, digits after a suffix, after an R and after a unit; a micro sign, a Greek mu and an ohm sign in each encoding of a deck; and the same forms inside braces. What a cell declares where no recording shows its form is a prediction, which the recording settles."
model = ["lib/format.py", "lib/hierarchy_expr.py", "lib/lint_rules.py", "lib/metrics.py", "lib/format.py:parse_spice_value", "lib/format.py:is_scaled_number", "lib/hierarchy_expr.py:_NUMBER", "lib/format.py:parse_plain_value", "lib/format.py:plain_number", "lib/lint_rules.py:_MILLI_SUFFIX_RE", "lib/metrics.py:parse_freq"]
# Each source's value is one form, so the voltage of its node in the .op raw
# is the number LTspice read. A form either build may refuse, or turn into a
# value that stops the run, is in a deck of its own, since a refusal stops the
# whole deck. Decks holding a micro sign, a Greek mu, an ohm sign or an
# Arabic-Indic digit are stored in UTF-16 with a byte order mark, which both
# builds decode (deck-encoding), except number_grid_utf8_bom (UTF-8 with a
# byte order mark), number_grid_utf16le (UTF-16 with none) and
# number_grid_cp1253 (code page 1253), which are the encodings those cells are
# about: keep their bytes as they are.
