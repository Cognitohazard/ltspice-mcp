# The condition a log line states --------------------------------------------

[grid.log-condition]
question = "Which condition does this line of an LTspice log state."
functions = [
    "lib/log_conditions.py:_RULES",
    "lib/log_conditions.py:log_lines",
    "lib/log_conditions.py:classify",
    "lib/log_conditions.py:rules_for",
    "lib/log_conditions.py:run_diagnostics",
    "lib/log_conditions.py:decoded_run_diagnostics",
    "lib/log_parser.py:classify_line",
]
item_axis = "form"
# Keys of a cell beside its coordinates: states, the code the cell's line
# states on each build, from what the line says ("none" for routine output);
# text, per build, words of the first line of the cell's occurrence, which the
# test finds the occurrence by; not_established, for a deck no recording shows,
# the reason what the cell declares is a prediction the recording settles;
# differs, a route or a function that answers otherwise than the cell, with
# the reason, pinned in the test.
item_keys = ["states", "text", "not_established", "differs"]
behaviours = ["log-diagnostics", "log-convergence", "undefined-element-models", "log-meas-failed", "log-timestep-collapse", "log-condition-grid"]
groups = [
    ["rule"],
    ["form", "phase"],
]

[grid.log-condition.axis]
# The rule of log_conditions._RULES that takes the line, on the build the cell
# names it for (a rule is named by its code, "routine" for none, the builds it
# claims, and its place among the rules of that code and those builds; the test
# derives the names from the rules and holds this list to them). Only the rules
# that claim an LTspice build: the ngspice rules have no recording.
rule = { default = "", values = [
    "unknown_model_parameter.lt26", "unknown_model_parameter.xvii",
    "unknown_instance_parameter.lt26", "unknown_instance_parameter.xvii",
    "unknown_directive.xvii",
    "missing_include.lt26", "missing_include.xvii",
    "missing_model.lt26", "missing_model.xvii.1", "missing_model.xvii.2",
    "undefined_parameter.lt26", "undefined_parameter.xvii",
    "measurement_error.lt26", "measurement_error.xvii",
    "measurement_failed.lt",
    "floating_node.lt",
    "singular_matrix.lt",
    "operating_point_fallback.lt26", "operating_point_fallback.xvii",
    "convergence_failed.lt",
    "device_size_warning.lt",
    "shorted_element.xvii",
    "dangling_node.xvii",
    "simulator_note.lt",
    "deck_error.lt26.1", "deck_error.lt26.2", "deck_error.xvii.1", "deck_error.xvii.2",
    "simulator_error.lt-ng", "simulator_warning.lt-ng",
    "routine.lt26.1", "routine.lt26.2", "routine.lt-ng.1", "routine.lt26.3", "routine.xvii.1",
    "routine.lt26.4", "routine.xvii.2", "routine.lt26.5", "routine.lt26.6", "routine.lt26.7",
    "routine.lt.1", "routine.lt.2", "routine.lt.3", "routine.lt.4", "routine.lt26.8",
    "routine.xvii.3", "routine.xvii.4", "routine.lt.5", "routine.xvii.5", "routine.xvii.6",
    "routine.lt.6", "routine.lt.7", "routine.lt.8", "routine.lt.9", "routine.lt.10",
    "routine.lt.11", "routine.lt.12", "routine.lt.13", "routine.lt.14", "routine.lt.15",
    "routine.lt.16", "routine.lt.17", "routine.lt26.9", "routine.lt26.10", "routine.lt-ng.2",
] }
# What the deck does to make a log state a condition, by the code the server
# gives that condition; a generic code (simulator_error, simulator_warning) is
# the code of a line no named rule takes, which no deck can be written for.
form = { default = "", values = [
    "unknown_model_parameter", "unknown_instance_parameter", "unknown_directive",
    "missing_include", "missing_model", "undefined_parameter", "measurement_error",
    "measurement_failed", "floating_node", "singular_matrix", "operating_point_fallback",
    "convergence_failed", "device_size_warning", "shorted_element", "dangling_node",
    "simulator_note", "deck_error",
] }
# Where in a run the deck meets it: reading the deck, solving the operating
# point, at the first point of the analysis, part way through it, evaluating a
# .meas over the results, or in the steps of a stepped run. A rule follows the
# lines after its head (_source_and_caret), XVII writes a collapse part way on
# the line of its progress (log_lines), the bias-point search's rungs are read
# as one solve (classify_line's _op_block_recovered), and LTspice 26 writes a
# deck's condition once a step (log/unknown_model_param).
phase = { default = "", values = ["deck", "operating_point", "sweep_start", "mid_run", "measurement", "stepped"] }

# Each rule claims the builds whose recordings its wording comes from.
[[grid.log-condition.exclude]]
at = { rule = [
    "unknown_model_parameter.lt26", "unknown_instance_parameter.lt26", "missing_include.lt26",
    "missing_model.lt26", "undefined_parameter.lt26", "measurement_error.lt26",
    "operating_point_fallback.lt26", "deck_error.lt26.1", "deck_error.lt26.2",
    "routine.lt26.1", "routine.lt26.2", "routine.lt26.3", "routine.lt26.4", "routine.lt26.5",
    "routine.lt26.6", "routine.lt26.7", "routine.lt26.8", "routine.lt26.9", "routine.lt26.10",
] }
builds = ["ltspice17"]
reason = "The rule claims LTspice 26 only."

[[grid.log-condition.exclude]]
at = { rule = [
    "unknown_model_parameter.xvii", "unknown_instance_parameter.xvii", "unknown_directive.xvii",
    "missing_include.xvii", "missing_model.xvii.1", "missing_model.xvii.2",
    "undefined_parameter.xvii", "measurement_error.xvii", "operating_point_fallback.xvii",
    "shorted_element.xvii", "dangling_node.xvii", "deck_error.xvii.1", "deck_error.xvii.2",
    "routine.xvii.1", "routine.xvii.2", "routine.xvii.3", "routine.xvii.4", "routine.xvii.5",
    "routine.xvii.6",
] }
builds = ["ltspice26"]
reason = "The rule claims LTspice XVII only."

[[grid.log-condition.exclude]]
at = { form = [
    "unknown_model_parameter", "unknown_instance_parameter", "unknown_directive",
    "missing_include", "missing_model", "undefined_parameter", "floating_node",
    "singular_matrix", "device_size_warning", "shorted_element", "dangling_node",
    "simulator_note", "deck_error",
], phase = ["operating_point", "sweep_start", "mid_run", "measurement"] }
reason = "LTspice reads the deck, and checks its elements, models and nodes, before it solves anything: a fault of the deck is met there."

[[grid.log-condition.exclude]]
at = { form = ["measurement_error"], phase = ["operating_point", "sweep_start", "mid_run"] }
reason = "A .meas card is read with the deck and evaluated over the results once the analysis has run."

[[grid.log-condition.exclude]]
at = { form = ["measurement_failed"], phase = ["deck", "operating_point", "sweep_start", "mid_run"] }
reason = "A measurement fails over the results, once the analysis has run."

[[grid.log-condition.exclude]]
at = { form = ["operating_point_fallback", "convergence_failed"], phase = ["deck", "measurement"] }
reason = "A solve is met after the deck is read and before the measurements are evaluated."

