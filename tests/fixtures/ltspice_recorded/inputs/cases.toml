# ---------------------------------------------------------------- the deck-card grid

[grid.deck-card]
question = "Which lines of a deck are cards, and which directive a card is: the cards LTspice reads from a deck's lines, and what it reads each directive card as."
# The reading of a deck's lines (lex_deck, over lex, whose branches are the
# title line, a + line and the comment and blank lines it may follow, a
# comment's column, a .end at the top level or inside a subcircuit, a .ends
# and the scope it closes, an opaque .control region, and the line breaks
# str.splitlines takes), the name a directive card starts with
# (directive_head), and the arguments after it (directive_args).
functions = [
    "lib/spice_lex.py:lex_deck",
    "lib/spice_lex.py:directive_head",
    "lib/spice_lex_views.py:directive_args",
]
item_axis = "card"
# Keys of a cell beside its coordinates. The item is the element whose value
# shows how the line was read (the subject, unless subject names another
# thing: a parameter, a model's parameter, a subcircuit, a measurement), or,
# for a directive, the card's first word as the deck writes it. node, the node
# whose voltage shows the reading; volts, each reading the subject may have
# (absent, or the number it takes) with the voltage it gives (a number, a list
# of them, missing where the node is not in the results, refused where the
# build stops on the deck); reads, the reading the form means (one, or one per
# build); file, included where the subject's card is in a file the deck
# includes; read_when, for a directive with a subject, whether the subject is
# present or absent when the card is read; printed, a measurement whose printing in the log shows the directive was
# read; not_established, why a cell's reading is a prediction no recording
# shows; differs, a route that answers otherwise, with the reason.
item_keys = ["subject", "node", "volts", "reads", "file", "read_when", "printed", "not_established", "differs"]
behaviours = ["deck-structure", "include-end", "deck-encoding", "card-grid"]
groups = [
    ["first_line"],
    ["plus_line"],
    ["comment"],
    ["end"],
    ["ends"],
    ["line_ending"],
    ["path"],
    ["directive", "spelling", "case"],
]

[grid.deck-card.outside]
"deck/gnd_alias" = "Which name is ground: a node name's meaning, not which lines are cards."
"deck/case_insensitive" = "Node names that differ only in case: a node name's meaning, not which lines are cards."
"deck/micro_utf8" = "What number a micro sign is: the value-number grid's."
"deck/micro_cp1252" = "What number a micro sign is: the value-number grid's."
"deck/micro_utf8_bom" = "What number a micro sign is: the value-number grid's."
"deck/micro_utf16le_bom" = "What number a micro sign is: the value-number grid's."
"deck/micro_utf16le" = "What number a micro sign is: the value-number grid's."
"deck/greek_mu_utf8" = "What number a Greek mu is: the value-number grid's."
"deck/section_sign_utf8" = "Which part a section sign names: the trace-name grid's."
"deck/section_sign_cp1252" = "Which part a section sign names: the trace-name grid's."
"deck/bytes_in_node_names" = "Which bytes a node name holds: a node name's spelling, not which lines are cards."

[grid.deck-card.axis]
# Line 1, which lex(title=True) keeps as a comment whatever it holds: text,
# a card, a directive, bytes that are not ASCII; and the first line of an
# included file, which lex_deck(title=False) reads as a card.
first_line = { values = ["text", "card", "directive", "non_ascii", "included_card"], default = "" }
# A + line, which _is_continuation joins to the card before it across comment
# and blank lines, and keeps as a comment when no card comes before it (right
# after the title, or first in an included file).
plus_line = { values = ["after_card", "after_comment", "after_blank", "first_in_deck", "first_in_include"], default = "" }
# A comment: a line starting with * (_classify_line), a ; outside quotes and
# braces, inside parentheses too, a $ standing alone (_lone_dollar), a $
# inside a word or starting one, which is no comment, and a ; at the end of a
# line the card is continued past.
comment = { values = ["star_line", "semicolon", "semicolon_in_parens", "semicolon_in_braces", "semicolon_in_quotes", "dollar_alone", "dollar_in_word", "dollar_leading", "before_plus"], default = "" }
# A .end: the deck's last card, one with cards after it (trailing), one in an
# included file, one inside a subcircuit's body (seen_top_end only at the top
# level), and none.
end = { values = ["last", "followed_by_cards", "in_include", "inside_subckt", "absent"], default = "" }
# A .ends: naming the subcircuit it closes, naming none, naming another
# (closed anyway, with a warning), with none open, and none before .end.
ends = { values = ["name_matches", "no_name", "name_differs", "orphan", "absent"], default = "" }
# The line break between cards, as str.splitlines takes them: a line feed, a
# carriage return and line feed, a carriage return alone, a form feed, and a
# next-line character (U+0085, byte 85 in cp1252).
line_ending = { values = ["lf", "crlf", "cr", "form_feed", "nel"], default = "" }
# A deck whose file name is not ASCII.
path = { values = ["non_ascii"], default = "" }
# The directives whose reading the server acts on: the lexer's own kinds
# (_classify_directive's .param .model .subckt .ends .end .meas, the
# INCLUDE_HEADS, the opaque .control region) and the heads other modules
# compare directive_head with (.func .save .global .options .step).
directive = { values = ["param", "func", "model", "subckt", "ends", "end", "include", "lib", "meas", "save", "global", "options", "step", "control"], default = "" }
# The spelling: the standard one, or the other the code knows (.params,
# .inc, .libfile, .measure, .opt).
spelling = { values = ["standard", "variant"], default = "" }
case = { values = ["lower", "upper"], default = "" }

[[grid.deck-card.exclude]]
at = { spelling = ["variant"], directive = ["func", "model", "subckt", "ends", "end", "save", "global", "step", "control"] }
reason = "The code knows no other spelling of these directives."

