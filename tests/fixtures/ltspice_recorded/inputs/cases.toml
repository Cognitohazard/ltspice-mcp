[grid.trace-name.axis]
# What the trace holds: a node voltage, a two-terminal device's current, one
# terminal's current of a device of more terminals (Id, Ic), a block's port
# current (Ix, declared subckt_current), a noise density (the output and
# input noise, a device's contribution), the noise run's gain, or the plot's
# sampled axis (trace_quantity's axis).
what = { values = ["node_voltage", "current", "terminal_current", "port_current", "noise", "gain", "axis"] }
# How deep in subcircuit instances the trace is: at the top, in a block, or
# in a block in a block (trace_keys's path; XVII drops each instance's X).
depth = { values = ["top", "block", "nested"] }
# The analysis of the run.
analysis = { values = ["tran", "ac", "dc", "noise", "op"] }
# The form of the name the user writes: as written, with the section sign of
# an exported part (R§Load, which a run names I(Load); section_sign_spellings),
# or in another case than the trace (fold_name).
form = { values = ["plain", "section_sign", "mixed_case"], default = "plain" }

[[grid.trace-name.exclude]]
at = { analysis = ["noise"], what = ["node_voltage", "current", "terminal_current", "port_current"] }
reason = "A noise run's raw holds its frequency, its gain, the output and input noise and each device's contribution, and no node voltage or current (raw/noise)."

[[grid.trace-name.exclude]]
at = { analysis = ["tran", "ac", "dc", "op"], what = ["noise", "gain"] }
reason = "Only a noise analysis writes a noise density or a gain."

[[grid.trace-name.exclude]]
at = { what = ["gain", "axis"], depth = ["block", "nested"] }
reason = "A run has one gain and one axis, its own, not a block's."

[[grid.trace-name.exclude]]
at = { what = ["axis"], analysis = ["op"] }
reason = "An operating point has no sampled axis."

[[grid.trace-name.exclude]]
at = { what = ["port_current"], depth = ["top"] }
reason = "A port current names a port of a block instance, so it is inside one block at least."

