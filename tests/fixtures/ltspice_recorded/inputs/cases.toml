# ---------------------------------------------------------------- the value-number grid

[grid.value-number]
question = "What number a value is: the number LTspice runs a value written that way as."
# The reader of a value as LTspice runs it (parse_spice_value), the strict
# test for a bare number that a card's readers ask before they call it a
# value (is_scaled_number), the number token inside an expression
# (hierarchy_expr._NUMBER), and the readers that answer the same question on
# their own: the plain reader a variation's assignment is held to
# (parse_plain_value), the plain-number test a model's parameters and a Monte
# Carlo nominal ask (plain_number), the lint's reading of a capital M
# (_MILLI_SUFFIX_RE), and a frequency's reader, which takes a trailing Hz off
# before it reads (parse_freq).
functions = [
    "lib/format.py:parse_spice_value",
    "lib/format.py:is_scaled_number",
    "lib/hierarchy_expr.py:_NUMBER",
    "lib/format.py:parse_plain_value",
    "lib/format.py:plain_number",
    "lib/lint_rules.py:_MILLI_SUFFIX_RE",
    "lib/metrics.py:parse_freq",
]
item_axis = "form"
# Keys of a cell beside its coordinates: the item is the value as the deck
# writes it; node, the node whose voltage is the number LTspice read (each
# source or resistor carries one form); number, that number, from the
# recording, or predicted from the recorded rules where none is recorded (one
# number, or one a build); not_established, why a cell's number is a
# prediction no recording shows the rule of, or why it has none; differs, a
# route that answers otherwise, with the reason; decoded, a build that reads
# other text than the server from the stored file (reads), which every route
# that starts from the file states and no route that reads text is held to.
item_keys = ["node", "number", "not_established", "differs", "decoded"]
behaviours = ["value-suffixes", "ohm-sign-value", "deck-encoding", "number-grid"]
groups = [
    ["suffix", "case", "tail"],
    ["mantissa", "after"],
    ["symbol"],
    ["sign", "encoding"],
    ["where", "suffix", "case"],
    ["where", "after"],
    ["where", "tail"],
    ["where", "mantissa"],
]

[grid.value-number.outside]
"deck/section_sign_utf8" = "A section sign in an instance name: it is in no value."
"deck/section_sign_cp1252" = "A section sign in an instance name: it is in no value."
"deck/bytes_outside_cp1252" = "Bytes cp1252 leaves undefined, in a title and in node names: they are in no value."
"deck/byte_85_in_comment" = "A byte in a comment: it is in no value."
"deck/bytes_in_node_names" = "Bytes in node names: they are in no value."

[grid.value-number.axis]
# The scale suffix after the mantissa (parse_spice_value's _SCALE_FACTORS,
# matched longest first, and the R that stands for a decimal point; the micro
# sign and the Greek mu, which fold_micro_sign reads as u). none: no letter
# that is a suffix follows the number.
suffix = { values = ["none", "t", "g", "meg", "k", "m", "u", "micro_sign", "greek_mu", "n", "p", "f", "mil", "r"], default = "" }
# The case the suffix is written in: mixed is a capital and small letters
# (Meg, Mil). parse_spice_value and is_scaled_number fold the case;
# _MILLI_SUFFIX_RE reads a capital M on its own.
case = { values = ["lower", "upper", "mixed"], default = "" }
# What follows the suffix: nothing, letters (a unit, which parse_spice_value
# skips and is_scaled_number refuses), or an ohm sign (no letter to
# _NUM_TAIL_RE, a letter to _NUMBER's \w).
tail = { values = ["none", "letters", "ohm_sign"], default = "" }
# How the mantissa is written (_MANTISSA, and the float() parse_spice_value
# tries first, which also takes an underscore, inf, nan, a number past the
# largest double, and a digit that is not ASCII).
mantissa = { values = ["whole", "decimal", "trailing_dot", "leading_dot", "exponent", "exponent_upper", "exponent_signed", "plus", "minus", "underscore", "inf", "nan", "overflow", "nonascii_digits"], default = "whole" }
# What follows the mantissa: nothing, a scale suffix, digits after a scale
# suffix (1k5), digits after an R (4R7), or digits after a letter that is no
# suffix (9V1): parse_spice_value reads the digits as the fraction only after
# a whole mantissa, and _NUMBER declines any of them.
after = { values = ["nothing", "suffix", "suffix_digits", "r_digits", "letter_digits"], default = "" }
# A sign after a number that is no letter: the percent sign.
symbol = { values = ["percent"], default = "" }
# A character of the form that is not ASCII, and the encoding the deck is
# stored in (encoding.decode_spice_bytes_with_encoding names any 8-bit file
# cp1252). UTF-16 big-endian and UTF-32, which the decoder also detects, are
# not crossed: no build has been recorded reading a deck stored so.
sign = { values = ["micro_sign", "greek_mu", "ohm_sign"], default = "" }
encoding = { values = ["utf8", "utf8_bom", "utf16le_bom", "utf16le", "cp1252", "cp1253"], default = "" }
# Where the form is written: an element's value, or alone inside braces,
# where hierarchy_expr reads it with _NUMBER.
where = { values = ["value", "braces"], default = "value" }

[[grid.value-number.exclude]]
at = { suffix = ["none"], case = ["upper", "mixed"] }
reason = "A value with no suffix has no letter to write in another case."

[[grid.value-number.exclude]]
at = { suffix = ["micro_sign", "greek_mu"], case = ["upper", "mixed"] }
reason = "The micro sign and the Greek mu both capitalise to the Greek capital Mu, a letter that is no suffix to either reader: written so, a value has a letter tail and no suffix."

[[grid.value-number.exclude]]
at = { suffix = ["t", "g", "k", "m", "u", "n", "p", "f", "r"], case = ["mixed"] }
reason = "A suffix of one letter is written in lower or upper case only."

[[grid.value-number.exclude]]
at = { mantissa = ["underscore", "inf", "nan", "overflow"], after = ["suffix", "suffix_digits", "r_digits", "letter_digits"] }
reason = "Only Python's float reads these, and only as the whole text: with anything after them every route of the server refuses the value, so none can take another number than LTspice."

[[grid.value-number.exclude]]
at = { sign = ["greek_mu", "ohm_sign"], encoding = ["cp1252"] }
reason = "cp1252 has no Greek mu and no ohm sign."
