inputs = ["connectivity/bus_label.asc"]
extra = ["connectivity/res.asy"]

[behaviour.schematic-save-encoding]
summary = "The bytes a build writes when it saves a sheet from its window: its encoding, its line endings, and the order and spelling of its records, for a sheet as the server writes one, the same sheet with its records in another order, the same sheet with CRLF line endings, and a sheet stored in each encoding."
model = ["lib/asc_document.py", "lib/encoding.py", "lib/schematic_scene.py"]

[behaviour.sheet-drawing]
summary = "What a build draws for a sheet: the triangle of a ground flag in each orientation and alone, where a part's name and value land at each of the eight placements and how big they are, that a Value2 attribute is drawn only with a visible WINDOW 123 line, and that a value's u is drawn as a micro sign, a window justified Invisible and one moved, a flag named GND drawn as a ground, a net label in the middle of a level and an upright wire and at a corner, and a port drawn as an outline around its name. The text and the triangle both follow the SchFontSize setting."
model = ["lib/schematic_scene.py", "lib/sheet_findings.py", "lib/schematic_renderer.py"]
# Each [[case]] of kind "draw" opens its sheet in the window and has the window
# write an image of it; see drive_draw. Each sheet starts with the two longest
# wires it holds, which give the scale from the image's units to sheet units.

[behaviour.sheet-drawing-other-text]
summary = "What else a build draws on a part: SpiceLine, SpiceLine2 and SpiceModel text through visible WINDOW 39, 40 and 38 lines, a window at the symbol's origin and one at size 0, two attributes at one point drawn over each other, a symbol's own value when the part gives none, nothing for a value written as \"\", and a symbol's own TEXT line and its pin names."
model = ["lib/schematic_scene.py", "lib/sheet.py", "lib/asc_document.py", "lib/sheet_findings.py", "lib/schematic_renderer.py", "tools/verify.py"]

