# ---------------------------------------------------------------- the expression-value grid

[grid.expression-value]
question = "What a parameter expression evaluates to: the number LTspice computes for an expression in braces, in quotes, with no braces, or in a .param."
# The evaluator (evaluate), the power it takes (_power), and the environment
# that evaluates a deck's parameters and an element's value with it
# (Environment). The number tokens inside an expression are the value-number
# grid's (_NUMBER). evaluate accepts no function and no operator but + - * /
# ** ^, unary + and -, and parentheses: a function call, a comparison, a
# ternary, % and // are refused (it takes no number from them), so they are
# not cells. Its length and node bounds refuse an expression, and are not
# readings.
functions = [
    "lib/hierarchy_expr.py:evaluate",
    "lib/hierarchy_expr.py:_power",
    "lib/hierarchy_expr.py:Environment",
]
item_axis = "expression"
# Keys of a cell beside its coordinates: the item is the expression as the
# deck writes it (for a .param, the card's assignment); node, the node whose
# voltage is what LTspice computed; number, that number, from the recording,
# or predicted where none is recorded; not_established, why it is a
# prediction no recording shows the rule of, or why it has none; differs, a
# route that answers otherwise, with the reason.
item_keys = ["node", "number", "not_established", "differs"]
behaviours = ["deck-semantics", "expression-grid"]
groups = [
    ["operator", "left", "right"],
    ["power", "base", "exponent"],
    ["unary", "operand"],
    ["chain"],
    ["wrap"],
    ["operands"],
]

[grid.expression-value.outside]
"deck/param_temp" = "A parameter named temp: which name a .param may take, not what an expression evaluates to."
"deck/options_temp" = "The temperature an .options card sets: no expression."
"deck/subckt_param_precedence" = "Which of a subcircuit's defaults and body .param a name reads: the scope of a name, not arithmetic."

[grid.expression-value.axis]
# A binary operator of _BINARY, and the sign of each operand.
operator = { values = ["plus", "minus", "times", "divide"], default = "" }
left = { values = ["positive", "negative", "zero"], default = "" }
right = { values = ["positive", "negative", "zero"], default = "" }
# A power, spelled ** or ^ (evaluate refuses the caret for LTspice), over a
# base and an exponent of each kind _power tells apart.
power = { values = ["star", "caret"], default = "" }
base = { values = ["positive", "zero", "negative"], default = "" }
exponent = { values = ["whole", "negative_whole", "zero", "fraction"], default = "" }
# A unary operator over an operand of each sign.
unary = { values = ["minus", "plus"], default = "" }
operand = { values = ["positive", "negative", "zero"], default = "" }
# An expression of more than one operator: associativity (a-b-c, a/b/c, two
# powers, which evaluate refuses), a negated power, a power of a negated name
# (which evaluate refuses for ngspice), precedence and parentheses.
chain = { values = ["minus_minus", "divide_divide", "power_power_star", "power_power_caret", "negated_power_star", "negated_power_caret", "power_negated_name", "precedence", "parentheses"], default = "" }
# How the expression is written: in braces, in quotes, in braces in braces,
# with no braces as an element's value, or as a .param's value with no braces
# (evaluate strips braces and quotes in a loop; an element's value with none
# is read as a value first).
wrap = { values = ["braces", "quotes", "nested_braces", "bare", "param"], default = "braces" }
# Whether the operands are written as numbers or as names of parameters
# (evaluate's Constant and Name).
operands = { values = ["literal", "parameter"] }
