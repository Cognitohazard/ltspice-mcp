[behaviour.step-temp-upper-case]
summary = "How the log and the raw name a temperature stepped as TEMP in upper case, beside raw/step_temp, which writes temp."
model = ["lib/log_parser.py", "lib/step_values.py", "lib/step_values.py:step_axis_key", "lib/log_parser.py:read_step_line"]
inputs = ["raw/step_temp_upper.cir"]

[behaviour.ohm-sign-value]
summary = "What a value written 10 followed by an ohm sign runs as, in UTF-8, in UTF-16 with a byte order mark, and in cp1253, a code page that has the sign (cp1252 has none)."
model = ["lib/format.py", "lib/lint_rules.py", "lib/encoding.py", "lib/hierarchy_expr.py", "lib/format.py:parse_spice_value", "lib/hierarchy_expr.py:_NUMBER"]
# 1 A into R1, so v(a) is the resistance read.
inputs = ["deck/ohm_utf8.cir", "deck/ohm_utf16le_bom.cir", "deck/ohm_cp1253.cir"]

[behaviour.params-without-space]
summary = "Whether an X line's params:g=3, with no space after the colon, passes g."
model = ["lib/spice_lex_views.py", "lib/hierarchy.py", "lib/spice_lex_views.py:ElementSpec", "lib/spice_lex_views.py:read_instance", "lib/spice_lex_views.py:SubcktCard"]
# 1 A through the body's g*1k: v(a) is 3000 if g=3 is passed, 1000 if the
# default is kept, and no raw if the line is refused.
inputs = ["deck/params_no_space.cir"]

[behaviour.lib-path-with-space]
summary = "Whether a .lib path holding a space is read as one path, unquoted and quoted."
model = [
    "lib/deck_staging.py",
    "lib/lint_rules.py",
    "lib/runner_base.py",
    "lib/hierarchy.py",
    "lib/netlist_graph.py",
]
# load.lib holds a 2k subcircuit: 1 A into it gives v(a) 2000 if the file is read.
inputs = ["deck/lib_path_space_unquoted.cir", "deck/lib_path_space_quoted.cir"]
extra = ["deck/spaced folder/load.lib"]

[behaviour.lib-whole-sectioned]
summary = "What a build reads of a file that declares sections, named by a .lib with no section: every card, the cards outside every section, or none."
model = ["lib/deck_staging.py"]
# sections.lib sets rout outside every section, rtt in section tt and rff in
# section ff. Each deck reads one of them through 1 A: v(a) is its value if
# that card is read, and there is no raw if it is not (or the line is
# refused). The server reads every card (``deck_staging.library_read``).
inputs = [
    "deck/lib_whole_sectioned_rout.cir",
    "deck/lib_whole_sectioned_rtt.cir",
    "deck/lib_whole_sectioned_rff.cir",
]
extra = ["deck/sections.lib"]
pending = "Written where no LTspice runs: record on Windows with scripts/record_ltspice_fixtures.py, then remove this key."

[behaviour.meas-subckt-node]
summary = "Whether a .meas reads a node inside a subcircuit instance XAMP, named xamp:mid and amp:mid, on the build's default settings and with subcircuit node voltages saved."
model = ["lib/lint_rules.py", "lib/device_names.py", "lib/hierarchy.py"]
# mid is the middle of a 1k/1k divider on a 1 V step, so the .meas reads 0.5
# where it reads the node at all.
inputs = ["deck/meas_subckt_node_x.cir", "deck/meas_subckt_node_no_x.cir"]

[behaviour.save-subckt-dotted]
summary = "Whether a .save and a .meas read a node inside a subcircuit instance spelled with a dot (xamp.mid), as ngspice spells it, as the build's own spelling with a colon."
model = ["lib/device_names.py", "lib/lint_rules.py"]
# mid is the middle of a 1k/1k divider on a 1 V step: the raw holds V(xamp:mid)
# (or V(amp:mid)) and the .meas reads 0.5 if the dot is read as a colon.
inputs = ["deck/save_subckt_dotted.cir"]
pending = "Written where no LTspice runs: record on Windows with scripts/record_ltspice_fixtures.py, then remove this key."

[behaviour.node-name-nonascii-case]
summary = "Whether two node names that differ only in case beyond ASCII (Äb and äb, Maß and MASS) are one node when a deck runs."
model = ["lib/device_names.py", "lib/connectivity.py"]
# Each current source drives its own name and each resistor sits on the other
# spelling: I(R1) and I(R2) are 1 mA only if the two spellings are one node.
inputs = ["deck/node_name_nonascii_case.cir"]
pending = "Written where no LTspice runs: record on Windows with scripts/record_ltspice_fixtures.py, then remove this key."

[behaviour.mos-charge-capacitances]
summary = "What the .op device table prints of a charge-model (BSIM3) MOSFET's capacitances, beside the capacitances an AC run of the same bias shows at its terminals."
model = ["lib/log_parser.py", "lib/runner_base.py"]
# In the AC run the gate is driven by 1 V and the other terminals held by 0 V
# sources, so each source's current at 1 MHz is j*2*pi*f times the
# capacitance between the gate and its terminal.
# LTspice XVII refuses .options logopinfo, so mos_charges_op_plain is the same
# deck without it.
inputs = ["log/mos_charges_op.cir", "log/mos_charges_op_plain.cir", "log/mos_charges_ac.cir"]

[behaviour.log-timestep-collapse]
summary = "What each build prints when a transient's time step collapses after its operating point is found: the wording, whether it repeats, and where in the log."
model = ["lib/log_conditions.py", "lib/log_parser.py", "lib/log_conditions.py:_RULES", "lib/log_conditions.py:log_lines", "lib/log_conditions.py:run_diagnostics", "lib/log_parser.py:classify_line"]
inputs = ["log/timestep_collapse_mid.cir"]

[behaviour.log-transient-convergence-progress]
summary = "What each build writes to the log while a transient fights for convergence at an edge and then finishes: whether XVII repeats its Heightened Def Con line and 26 its tolerance warning, how often, and where, beside the points the run stored. Nothing reads these lines as a count yet: the recording establishes what such a count would read."
model = ["lib/log_conditions.py"]
inputs = ["log/tran_convergence_recovers.cir"]
pending = "Written where no LTspice runs: record on Windows with scripts/record_ltspice_fixtures.py, then remove this key."

[behaviour.random-seed]
summary = "Whether .options seed=N makes mc(), gauss() and flat() repeat across runs, and change with N, against two runs with no seed."
model = ["lib/experiment_inputs.py", "lib/montecarlo.py"]
# The _again cases run the same deck a second time, so the two operating
# points are equal only if the draw repeats.
inputs = ["deck/seed_7.cir", "deck/seed_8.cir", "deck/seed_none.cir"]

[behaviour.text-spacing]
summary = "Whether a TEXT line spaced other than as LTspice writes one (two spaces after TEXT, a tab before the justification, two spaces before the size) is read: whether its directive is exported."
model = ["lib/asc_document.py"]
# The .param on a line spaced as LTspice writes it says the export ran; the
# .tran is in the export only if the irregular line was read.
inputs = ["export/text_irregular_spacing.asc"]
extra = ["export/res.asy"]

[behaviour.value-inner-space]
summary = "The card each build exports for a Value written 1 k, with a space inside it, and for a Value of 1k beside a SpiceLine of tol=5."
model = ["lib/sheet.py", "lib/component_value.py", "lib/schematic_ops.py"]
inputs = ["export/value_inner_space.asc"]
extra = ["export/res.asy"]

[behaviour.block-sheet-directives]
summary = "Where an export puts the directives on a hierarchical block's own sheet (.param, .model, .options): inside the block's subcircuit or at the top of the deck. Nothing in the server models this yet: it reads a sheet's directives from the sheet itself and a block sheet's through LTspice's export."
model = []
inputs = ["export/hier_directives_top.asc"]
extra = ["export/hier_directives.asc", "export/hier_directives.asy"]

[behaviour.a-device-open-pin]
summary = "What an export writes for the pins of an A-device (a digital gate) that nothing is connected to."
model = ["lib/connectivity.py", "lib/nets.py", "lib/export_nets.py"]
# A1's pins 1, 2 and 7 are labelled a, b and y, pin 5 is on ground, and pins
# 3, 4, 6 and 8 touch nothing.
inputs = ["export/adevice_open_pin.asc"]
extra = ["export/a8.asy"]

[behaviour.block-device-op-name]
summary = "How the .op device table names a device inside a hierarchical block placed under a name that does not start with X (U1), when the sheet is run: with .options logopinfo, which LTspice 26 needs to print the table, and without it, which LTspice XVII needs, since it refuses the option."
model = ["lib/log_parser.py", "lib/device_names.py", "api/_primitives.py"]
# U1 places hier_device, whose own sheet holds R1 and D1 between its ports; the
# top sheet drives it from 3 V into a 10k load. The [[case]] tables at the end
# run each top sheet and keep its netlist, log and raw.

[behaviour.rerun-identity]
summary = "That running one deck twice on one build writes the same results: the raw files differ only in the header's Date line, and on LTspice 26 in the Title line, which names the folder the deck ran in."
model = ["lib/experiment_runner.py", "lib/experiment_store.py"]
evidence = "every recording: re-recording a case with --check compares the new files with the committed ones after the recorder removes dates and paths, and reports no difference for the same build. Without that removal, raw/tran, raw/ac and log/meas_forms were each run twice on LTspice 26.1.1 and XVII 17.0.37 into two folders: every byte of each raw after its header matched, and the headers differed in Date and, on LTspice 26, in Title alone."

[behaviour.recovery-startup-profile]
summary = "What a build does at startup with the settings file a recoverable run gives it: whether an identifier, an analytics choice and a recent update check let it run the deck without a prompt, and how old the check may be. lib/controlled_ltspice.py takes this from an audit of one LTspice 26 executable and checks the keys UUID, CaptureAnalytics and LastWebUpdateQuery."
model = ["lib/controlled_ltspice.py"]
unrecordable = "A recording would start each build with an old or missing update check, on which a build may start its updater, and XVII has updated itself that way on this machine; a recording must not change the build it records. It was looked at instead. The LTspice 26.1.1 recorded here (its digest is in the manifest) is not the audited executable, so recovery refuses it by digest. Its settings file holds UUID (20 digits), CaptureAnalytics and LastWebUpdateTime, and no LastWebUpdateQuery, the key the server checks, so recovery would refuse its profile too. XVII 17.0.37's file holds both LastWebUpdateQuery and LastWebUpdateTime. Every case here ran on a copy of the recording user's settings whose update time was about 40 days old, with -ini after the deck, and no build stopped on a prompt. Adopting 26.1.1 needs its startup audited as the earlier build's was: which update key it reads, in what form, and after how long it prompts or starts its updater, found by reading the executable or on a machine where its updater can do no harm."

# ---------------------------------------------------------------- cases an input path cannot describe

[[case]]
id = "raw/tran_op_raw"
behaviour = "raw-op"
source = "raw/tran.cir"
keep = ["op.raw"]
note = "The operating-point raw LTspice writes beside a transient's raw."

# What a stepped run leaves in the operating-point raw beside its own: one
# point a step, or one point. Their logs are those of raw/step_tran and
# raw/step_ac, which run the same decks.
[[case]]
id = "raw/step_tran_op_raw"
behaviour = "raw-stepped"
source = "raw/step_tran.cir"
keep = ["op.raw"]

[[case]]
id = "raw/step_ac_op_raw"
behaviour = "raw-stepped"
source = "raw/step_ac.cir"
keep = ["op.raw"]

# A build ignores -ascii when it is also given a settings file, so these two
# run on the recording user's own settings. What they pin is the file's form,
# so a fresh recording is compared with them on the header alone. Both builds
# also ignore the switch when the deck's own file name contains "ascii", which
# is why these cases are not named for it.
[[case]]
id = "raw/tran_as_text"
behaviour = "raw-ascii"
source = "raw/tran.cir"
switches = ["-ascii"]
settings = false
volatile = true

[[case]]
id = "raw/ac_as_text"
behaviour = "raw-ascii"
source = "raw/ac.cir"
switches = ["-ascii"]
settings = false
volatile = true

# LTspice 24 and later also have a setting for it, which a settings file can
# carry, so this one runs on the same settings as raw/tran and holds the same
# samples. LTspice XVII has no such setting.
[[case]]
id = "raw/tran_as_text_setting"
behaviour = "raw-ascii"
source = "raw/tran.cir"
ini = { AsciiRawFile = "true" }
builds = ["current"]

# Card forms whose point is that the deck runs; the log shows it did, and the
# waveform would only add bulk.
[[case]]
id = "deck/ic_comma"
behaviour = "deck-forms"
source = "deck/ic_comma.cir"
keep = ["log"]

[[case]]
id = "deck/keyword_values"
behaviour = "deck-forms"
source = "deck/keyword_values.cir"
keep = ["log"]

[[case]]
id = "deck/meas_functions"
behaviour = "deck-forms"
source = "deck/meas_functions.cir"
keep = ["log"]

[[case]]
id = "deck/meas_function_vdb"
behaviour = "deck-forms"
source = "deck/meas_function_vdb.cir"
keep = ["log"]

[[case]]
id = "deck/meas_function_phase"
behaviour = "deck-forms"
source = "deck/meas_function_phase.cir"
keep = ["log"]

[[case]]
id = "deck/meas_function_group_delay"
behaviour = "deck-forms"
source = "deck/meas_function_group_delay.cir"
keep = ["log"]

[[case]]
id = "deck/tran_zero_step"
behaviour = "deck-forms"
source = "deck/tran_zero_step.cir"
keep = ["log"]

[[case]]
id = "deck/tran_lone_stop"
behaviour = "deck-forms"
source = "deck/tran_lone_stop.cir"
keep = ["log"]

[[case]]
id = "deck/tran_modifiers"
behaviour = "deck-forms"
source = "deck/tran_modifiers.cir"
keep = ["log"]

# ph() at the corner of an RC low-pass is -45 degrees; the log shows the unit,
# and the AC waveform would only add bulk.
[[case]]
id = "log/meas_phase"
behaviour = "log-meas-angle-unit"
source = "log/meas_phase.cir"
keep = ["log"]

# The settings key behind "Use radian measure in waveform expressions" (the
# Waveforms page of the settings). Both builds default it to off.
[[case]]
id = "log/meas_trig_radian"
behaviour = "log-meas-angle-unit"
source = "log/meas_trig.cir"
ini = { RadianMeasure = "true" }
keep = ["log"]
note = "The trig deck with the setting that makes waveform expressions, .meas among them, work in radians."

[[case]]
id = "log/meas_phase_radian"
behaviour = "log-meas-angle-unit"
source = "log/meas_phase.cir"
ini = { RadianMeasure = "true" }
keep = ["log"]
note = "ph() with the same setting."

# The settings keys behind "Save subcircuit node voltages" and "Save
# subcircuit device currents" (the Save Defaults page of the settings). Both
# builds default them to off, and then store nothing from inside a
# subcircuit but its port currents.
[[case]]
id = "raw/subckt_names_tran_saved"
behaviour = "subckt-device-names"
source = "raw/subckt_names_tran.cir"
ini = { SaveSubcircuitNodeVoltages = "true", SaveSubcircuitDeviceCurrents = "true" }
note = "The transient with the settings that store the nodes and device currents inside subcircuits."

[[case]]
id = "log/subckt_names_saved"
behaviour = "subckt-device-names"
source = "log/subckt_names.cir"
ini = { SaveSubcircuitNodeVoltages = "true", SaveSubcircuitDeviceCurrents = "true" }
note = "The .op with logopinfo and the same settings, for the operating-point raw beside the device table."

[[case]]
id = "log/subckt_names_off_saved"
behaviour = "subckt-device-names"
source = "log/subckt_names_off.cir"
ini = { SaveSubcircuitNodeVoltages = "true", SaveSubcircuitDeviceCurrents = "true" }
note = "The .op without logopinfo and the same settings."

[[case]]
id = "raw/tran_fastaccess"
behaviour = "raw-fastaccess"
kind = "fastaccess"
source = "raw/tran.cir"

[[case]]
id = "raw/tran_killed"
behaviour = "raw-partial"
kind = "kill"
source = "raw/tran_killed.cir"
kill_after_bytes = 20000
kill_after_s = 20
volatile = true
note = "Stopped once the raw holds 20 kB; how far the run got differs every time."

[[case]]
id = "export/micro_cp1252_as_u"
behaviour = "export-encoding"
source = "export/micro_cp1252.asc"
extra = ["export/res.asy"]
ini = { NoGreekMus = "true" }
note = "The same sheet with the setting that asks LTspice to write u for the micro sign."

# What a build writes when it makes the panes itself. LTspice 26 adds a pane
# above or below the active one; LTspice XVII has one command, Add Plot Pane.
[[case]]
id = "plot/one_trace"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_tran.asc"
steps = [{ trace = "V(out)" }]

[[case]]
id = "plot/pane_below"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_tran.asc"
steps = [
    { trace = "V(out)" },
    { command = "Add Plot Pane Below Active Pane" },
    { trace = "V(in)" },
    { trace = "I(R1)" },
]
builds = ["current"]
note = "The second pane is added below the first, so the file shows which end of the list is the bottom of the window."

[[case]]
id = "plot/pane_added"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_tran.asc"
steps = [
    { trace = "V(out)" },
    { command = "Add Plot Pane" },
    { trace = "V(in)" },
    { trace = "I(R1)" },
]
builds = ["xvii"]

[[case]]
id = "plot/math"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_tran.asc"
steps = [{ trace = "V(in)-V(out)" }, { trace = "V(out)*I(R1)" }]
note = "A power on the right axis, which the build labels with a micro sign."

[[case]]
id = "plot/ac"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_ac.asc"
steps = [{ trace = "V(out)" }]

[[case]]
id = "plot/dc"
behaviour = "plot-settings"
kind = "plot"
source = "plot/div_dc.asc"
steps = [{ trace = "V(out)" }]

[[case]]
id = "plot/noise"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_noise.asc"
steps = [{ trace = "V(onoise)" }]

# The waveform window's grid, a settings key the recorder removes from every
# case that does not set it (BEHAVIOUR_KEYS in tests/ltspice_recorder.py says
# why).
[[case]]
id = "plot/ac_grid_on"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_ac.asc"
steps = [{ trace = "V(out)" }]
ini = { grid = "on" }
note = "plot/ac with the grid on: a GridStyle line in the pane, and a phase axis written differently."

[[case]]
id = "plot/math_grid"
behaviour = "plot-settings"
kind = "plot"
source = "plot/rc_tran.asc"
steps = [{ trace = "V(in)-V(out)" }, { trace = "V(out)*I(R1)" }]
ini = { grid = "on" }
note = "plot/math with the grid on: a GridStyle line in the pane, and the left axis ranged out to as many divisions as the right one has."

# What a build makes of a file the server wrote. lib/plot_settings.py writes
# every one of these but spaced.plt, which is its form for a trace with the
# spaces it refuses since this case was recorded; tests/test_plot_settings.py
