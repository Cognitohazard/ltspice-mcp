# A stock nmos4 placed as MB1 with a Prefix of X runs wrapped_nmos, an NMOS
# card M1 wrapped in a subcircuit of its own; a directive on the sheet calls
# the same subcircuit as XMB2; R1 feeds MB1's drain over a wire with no label.
# The settings store the devices inside subcircuits, so the raw names M1 under
# each instance as the build names it.
[[case]]
id = "export/sheet_part_names"
behaviour = "sheet-part-trace-names"
kind = "run"
source = "export/sheet_part_names.asc"
extra = ["export/wrapped_nmos.sub"]
ini = { SaveSubcircuitNodeVoltages = "true", SaveSubcircuitDeviceCurrents = "true" }
keep = ["net", "log", "raw"]

# A frequency response analysis over two .step values: how the results file
# beside the transient raw holds each step. LTspice XVII 17.0 refuses the
# analyzer (raw/fra records that), so only the current build runs this.
[[case]]
id = "raw/fra_step"
behaviour = "raw-fra"
source = "raw/fra_step.cir"
keep = ["log", "raw", "fra_1.raw"]
builds = ["current"]

# The same loop under .options numdgt=7: whether the results file, a complex
# plot, carries the double flag and what it changes. Only the current build
