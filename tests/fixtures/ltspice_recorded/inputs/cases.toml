# ---------------------------------------------------------------- grid: how a trace is named

[grid.trace-name]
question = "Which trace of a result a signal name reads, and what that trace holds."
# How a build spells a name inside subcircuit instances (naming_for), the key
# two spellings of one trace share (trace_keys), the trace a name finds
# (find_trace), and what it holds: by its name and declared type
# (trace_quantity), by its plot (node_voltages, which counts no trace of a
# noise plot a node voltage) and by its unit (declared_unit).
functions = [
    "lib/device_names.py:naming_for",
    "lib/device_names.py:trace_keys",
    "lib/trace_names.py:find_trace",
    "lib/trace_names.py:trace_quantity",
    "lib/raw_parser.py:node_voltages",
    "lib/decoded_raw.py:declared_unit",
]
item_axis = "what"
# Keys of a cell beside its coordinates: the cell's item is the name a user
# writes (LTspice 26's spelling, each instance with its X); trace, the trace
# each build wrote for it, from the recording, or the build's spelling as the
# recorded ones spell it where none is recorded (with not_established);
# not_established, why that is a prediction; differs, a route that answers
# otherwise, with the reason.
item_keys = ["trace", "not_established", "differs"]
