[behaviour.export-hierarchical-block]
summary = "A sheet that places a hierarchical block whose own sheet and symbol sit beside it, the symbol drawn as LTspice draws one or given a Prefix of X: the netlist each build exports for it, and what a build writes when it runs the sheet."
model = ["lib/deck_prep.py", "lib/schematic_ops.py", "lib/symbol_library.py", "lib/trace_names.py", "lib/trace_names.py:find_trace"]
# hier_plain.asy is a block symbol with pins IN and OUT and no attribute, as
# LTspice makes one for a sheet; hier_amp.asy is the same block with
# SYMATTR Prefix X. Each block's own sheet (hier_plain.asc, hier_amp.asc) is
# a 1k/1k divider between ports of those names. Each top sheet drives its
# block from a 1 V source into a 10k load and runs .op.
inputs = ["export/hier_top.asc", "export/hier_plain_top.asc"]
extra = ["export/hier_amp.asc", "export/hier_amp.asy", "export/hier_plain.asc", "export/hier_plain.asy"]

[behaviour.block-sheet-search]
summary = "Where a build finds a hierarchical block's own sheet when it is not beside the block's symbol: beside the sheet exported, beside a block's sheet that places it, in a folder of the symbol search path, or in a folder under one; which it takes when one is beside the sheet exported and another beside the symbol; what it exports when there is none; and whether it finds a symbol in a folder under the search path."
model = ["lib/symbol_library.py", "lib/schematic_ops.py", "lib/deck_prep.py", "lib/netlist_diff.py"]
# Each case exports blocks/top.asc, which places the block blk, or
# blocks/nest_top.asc, whose block outer places blk on its own sheet, with
# blk.asy and blk.asc in other places. The symbol search path is the case's
# own lib folder. Each copy of blk's sheet holds other resistor values (3k
# and 1k beside the sheet exported, 1k and 1k in lib, 2k and 2k in lib/sub),
# so the subcircuit an export writes says which sheet the build took. See the
# [[case]] tables at the end. A block in the build's own sym folder is not
# recorded: no stock block symbol leaves its sheet unnamed, and a case would
# have to write files into the build's library. The search-path cases stand
# for it, as another folder a build searches for symbols.

[behaviour.sheet-part-trace-names]
summary = "What a run of a sheet names the device inside a part whose symbol is given a Prefix of X and a reference that does not start with X, beside the same subcircuit called with X from a directive on the sheet, and the net the sheet leaves unlabelled."
model = ["lib/trace_names.py", "lib/device_names.py", "lib/device_names.py:trace_keys", "lib/trace_names.py:find_trace"]

[behaviour.section-sign-trace-tran]
summary = "What a transient run of a sheet names the current of a part exported as R§Load, which plot_waveform charts: the name the operating point gives it (I(Load)) or another."
model = ["lib/trace_names.py", "lib/device_names.py", "tools/analysis.py", "lib/trace_names.py:find_trace"]

[behaviour.trace-name-grid]
summary = "The cells of the trace-name grid (at the end of this file) that no other recording fills: a node voltage, a two-terminal current, a terminal current and a port current at the top, in a block and in a block in a block, in a transient, an AC sweep, a DC sweep and an operating point, with subcircuit voltages and currents saved; the noise contribution of a resistor at each depth; and the current of a part named with a section sign in an AC sweep, a DC sweep and a noise run. What a cell declares where no recording shows its form is a prediction, which the recording settles."
model = ["lib/trace_names.py", "lib/device_names.py", "lib/raw_parser.py", "lib/decoded_raw.py", "lib/device_names.py:naming_for", "lib/device_names.py:trace_keys", "lib/trace_names.py:find_trace", "lib/trace_names.py:trace_quantity", "lib/raw_parser.py:node_voltages", "lib/decoded_raw.py:declared_unit"]
# The four decks of every kind of trace, and the noise deck, run with both
# subcircuit settings on, as cases at the end; the section-sign decks are
# written in UTF-8, which every build reads a section sign in (deck-encoding).
inputs = ["raw/trace_grid_section_ac.cir", "raw/trace_grid_section_dc.cir", "raw/trace_grid_section_noise.cir"]
pending = "Written where no LTspice runs: record on Windows with scripts/record_ltspice_fixtures.py, then remove this key."

[behaviour.export-instance-prefix]
summary = "What an instance's own Prefix attribute does on export: the element letter it gives the card and how the instance name is then written, in either case of the letter, before or after InstName, on a library-style symbol, a stock symbol and a block symbol."
model = ["lib/schematic_ops.py"]
inputs = ["export/instance_prefix.asc"]
extra = ["export/res.asy", "export/cell4.asy"]

[behaviour.export-attributes]
summary = "Where Value2, SpiceLine, SpiceLine2 and SpiceModel land on an exported card: subcircuit parameters, a params: marker, and a transistor's or diode's area factor."
model = ["lib/spice_lex_views.py", "lib/netlist_diff.py", "lib/schematic_ops.py", "lib/sheet.py", "lib/sheet_findings.py"]
inputs = ["export/attributes.asc"]
extra = ["export/cell4.asy"]

[behaviour.export-directives]
summary = "How directive text on a sheet reaches the netlist: .include and .lib lines, a two-line directive, a sheet comment."
model = ["lib/netlist_diff.py", "lib/deck_staging.py", "lib/schematic_scene.py"]
inputs = ["export/directives.asc"]
extra = ["export/res.asy"]

[behaviour.export-multiline-text]
summary = "How a directive and a comment of more than one line are written into the netlist each build exports."
model = ["lib/schematic_ops.py", "lib/netlist_diff.py"]
# A sheet's TEXT record holds each line break of its text as the two
# characters \n. The sheet holds a comment of two lines and a directive of
# two lines, beside a resistor and a voltage source drawn with the suite's
# stand-in symbols, so the suite reads the sheet as the builds do.
inputs = ["export/multiline_text.asc"]
extra = ["export/res.asy", "benchmark/voltage.asy"]

[behaviour.sheet-records]
summary = "The lines a sheet holds besides its symbols, wires, labels and text: a data label (DATAFLAG) and a bus tap (BUSTAP) are read by both builds and put nothing in the netlist, an empty line is read past, and a keyword a build does not know stops the export."
model = ["lib/schematic_ops.py", "tools/schematic_edit.py", "lib/schematic_scene.py"]
# unknown_record is what makes an export a statement that a build reads a
# record: neither build exports a sheet holding a keyword it does not know.
# data_flags lists its records in the order of the example sheets both builds
# install, where the data labels follow the net labels and come ahead of the
# first symbol. bus_tap has R1 on the bus itself, R2 on a tapped wire labelled
# D0 and R3 on a tapped wire with no label, so the export names the node on
# each side of a tap.
inputs = [
    "export/data_flags.asc",
    "export/bus_tap.asc",
    "export/blank_line.asc",
    "export/unknown_record.asc",
]
extra = ["export/res.asy"]

[behaviour.text-backslash]
summary = "A backslash in a sheet's TEXT record other than a line break's \\n: a doubled backslash, one before another letter, a doubled one before n, and one at the end, in a comment and in a directive, as each build exports them and draws them."
model = ["lib/schematic_scene.py", "lib/schematic_ops.py", "lib/schematic_renderer.py", "lib/asc_document.py"]
# The comments and directives hold the same four texts. The directives are
# .param cards whose text after ; is a comment, so the export shows how the
# build split and spelled each line. draw/text_backslash draws the same texts
# (a [[case]] table at the end).
inputs = ["export/text_backslash.asc"]
extra = ["export/res.asy", "benchmark/voltage.asy"]

[behaviour.value-spaces]
summary = "How each build writes a part's Value holding spaces onto its card: a resistance followed by a parameter, the same with two spaces between them, a value after two spaces, a source's PULSE() and a value followed by Rser=."
model = ["lib/sheet.py", "lib/schematic_ops.py", "lib/sheet_findings.py", "lib/component_value.py"]
inputs = ["export/value_spaces.asc"]
extra = ["export/res.asy", "benchmark/voltage.asy"]

[behaviour.window-short]
summary = "A WINDOW line with fewer than its five numbers and words: on a part placed on a sheet, without its size and without its justification and size, and in a symbol, as each build exports the sheet."
model = ["lib/asc_document.py", "lib/symbol_file.py", "lib/sheet.py", "lib/schematic_scene.py", "lib/schematic_ops.py"]
# window_short.asy is export/res.asy with its two WINDOW lines cut short the
# same two ways. A line a build cannot read stops the export, as an unknown
# keyword does (sheet-records).
inputs = [
    "export/window_no_size.asc",
    "export/window_no_justification.asc",
    "export/window_short_symbol.asc",
]
extra = ["export/res.asy", "export/window_short.asy"]

[behaviour.bus-labels]
summary = "The node of a pin on a wire labelled as a bus (D[0:3]): the bus's first member, D[0], which is the node of a wire labelled D[0] and not that of one labelled D[1]."
model = ["lib/schematic_ops.py"]
# No bus tap, so the schematic editor opens the sheet and its net partition
