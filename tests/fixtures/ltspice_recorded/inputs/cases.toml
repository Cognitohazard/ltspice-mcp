# ---------------------------------------------------------------- the element-node grid

[grid.element-node]
question = "How many nodes an element card takes, and what follows them: which words of the card LTspice wires as its nodes, and which it reads as its model."
# The table of each letter's shape (ElementSpec, held in ELEMENT_SPECS) and the
# view that splits a card by it (read_instance, over InstanceLine.from_card,
# whose branches are a source's words after its two nodes, the exact node
# count of _EXACT_NODE_COUNT, a value keyed after the nodes and the keys that
# define a part (_DEFINING_KEYS), a switch's state, the area or OFF after a
# device's model, a W switch's controlling source and a call's params:).
functions = [
    "lib/spice_lex_views.py:ElementSpec",
    "lib/spice_lex_views.py:read_instance",
]
item_axis = "card"
# Keys of a cell beside its coordinates: the item is the element's reference;
# nodes, the words of its card the form makes its nodes, ground left out;
# model, the word the form makes its model; not_established, why a cell is a
# prediction no recording shows; differs, a route that answers otherwise.
item_keys = ["nodes", "model", "not_established", "differs"]
behaviours = ["element-terminals", "params-without-space", "three-node-transistors", "deck-forms", "element-grid"]
groups = [
    ["letter", "follows"],
    ["node_count"],
    ["switch_state"],
    ["params_marker"],
]

[grid.element-node.outside]
"export/elements" = "An export: which nodes a sheet's part is written with, not how a card is read."
"deck/vdmos_three_node" = "A VDMOS card's three nodes beside four: what its bulk is wired to, which the raw of an AC run cannot show by node names."
"deck/vdmos_bulk_elsewhere" = "A VDMOS card whose bulk is not its source, which a build refuses for its model, not for its nodes."
"deck/op_and_tran" = "Two analyses in one deck: which analyses a deck may hold, not an element."
"deck/ac_and_tran" = "Two analyses in one deck: which analyses a deck may hold, not an element."
"deck/save_omits_meas" = "A .save card: the deck-card grid's."
"deck/meas_functions" = "The functions a .meas may call: no element."
"deck/meas_function_vdb" = "The functions a .meas may call: no element."
"deck/meas_function_phase" = "The functions a .meas may call: no element."
"deck/meas_function_group_delay" = "The functions a .meas may call: no element."
"deck/tran_zero_step" = "The arguments of a .tran card: no element."
"deck/tran_lone_stop" = "The arguments of a .tran card: no element."
"deck/tran_modifiers" = "The arguments of a .tran card: no element."
"deck/keyword_values" = "Kept with its log alone: no node voltage shows which words of its cards are nodes."
"deck/ic_comma" = "Kept with its log alone: no node voltage shows which words of its cards are nodes."

[grid.element-node.axis]
# The element letters the code knows a shape for (ELEMENT_SPECS, D in
# _EXACT_NODE_COUNT, S by its switch state), and A, LTspice's special
# function, which it reads with the default shape.
letter = { values = ["R", "C", "L", "V", "I", "E", "G", "F", "H", "B", "K", "D", "Q", "M", "J", "Z", "O", "U", "T", "W", "S", "X", "@", "A"], default = "" }
# What follows the nodes: a positional value, a model, a keyed value, nothing.
follows = { values = ["value", "model", "keyed", "nothing"], default = "" }
# The node counts that vary: a BJT with three and four nodes, a MOSFET with
# three and four, and an area after a device's model, which a node count
# that is not fixed may take for a node.
node_count = { values = ["q_three", "q_four", "m_three", "m_four", "area_after_model"], default = "" }
# A switch's state after its model (_SWITCH_STATES), on S and W.
switch_state = { values = ["s_on", "s_off", "w_on", "w_off"], default = "" }
# A subcircuit call's params: (the view drops it as no node): written, left
# out, in upper case, and with no space before the first assignment.
params_marker = { values = ["present", "absent", "upper", "no_space"], default = "" }

[[grid.element-node.exclude]]
at = { follows = ["value"], letter = ["B", "D", "Q", "M", "J", "Z", "O", "U", "T", "W", "S", "X", "@", "A"] }
reason = "These name a model after their nodes, or take their value keyed: no positional value follows their nodes."

[[grid.element-node.exclude]]
at = { follows = ["model"], letter = ["R", "C", "L", "V", "I", "E", "G", "F", "H", "B", "K", "T", "@"] }
reason = "These take a value, or keyed parameters, after their nodes: no model follows them."

[[grid.element-node.exclude]]
at = { follows = ["keyed"], letter = ["F", "H", "K", "D", "Q", "M", "J", "Z", "O", "U", "W", "S", "X", "A"] }
reason = "These take a controlling source, inductors or a model after their nodes: no keyed value comes first."

[[grid.element-node.exclude]]
at = { follows = ["nothing"], letter = ["E", "G", "F", "H", "B", "K", "D", "Q", "M", "J", "Z", "O", "U", "T", "W", "S", "X", "@", "A"] }
reason = "A card of these with nothing after its nodes has no model, gain or parameter to read: only a two-terminal value element may lack one."

[[grid.element-node.exclude]]
at = { letter = ["@"] }
builds = ["ltspice17"]
reason = "LTspice XVII has no frequency response analyzer."

