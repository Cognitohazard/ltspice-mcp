[grid.printed-measurement.cell.items]
d_when = "deriv_when"
d_at = "deriv_at"
t_when = { form = "when", level = "number" }

[[grid.printed-measurement.cell]]
cases = ["log/meas_failed"]
at = { analysis = "tran", stepped = "no", outcome = "value", printed = "line" }
[grid.printed-measurement.cell.items]
