t_param = { form = "when", level = "parameter" }
t_expr = { form = "when", level = "expression" }
t_braced = { form = "when", level = "braced" }
vmax = "max"
t_meas = { form = "when", level = "measurement" }

[[grid.printed-measurement.cell]]
