# ---------------------------------------------------------------------- grids
#
# A grid is an index over the cases above for one question that a short list
# of functions decides: the full cross of the input forms those functions
# depend on, so that each function is tested on every cell rather than on the
# cases someone happened to write. It names no file of its own: a cell is one
# item of a case (here a measurement of a deck) with its coordinates, and the
# tests read the case's recordings. docs/TESTING.md ("Grids") says how to add a
# cell and a grid.
#
# A grid gives its `question`, the `functions` that decide it (module:name,
# each also named by the `model` of a behaviour above), its axes, and its
# groups: the axes of a group are crossed, and each group stands apart from the
# others. Every coordinate of every group has a cell unless an `exclude` entry
# says why it cannot. An axis may give a `default`, which a cell that names no
# value takes; a default that is not one of the axis's values ("") marks a cell
# the axis does not apply to, and such a cell covers no coordinate of a group
# holding that axis. `item_axis` names the axis a cell's item gives by a bare
# string. `expect` gives what the grid's test expects, by axis value.
#
# A cell table names its `cases` and its `items`; `at` holds the coordinates
# its items share, and an item gives its own as a string (its `item_axis`
# value) or a table. A cell or an item may give, per build, other coordinates
# (`on = { ltspice17 = { outcome = "failed" } }`) and `refused = { <build> =
# "<why>" }` for a build that does not take the item at all, which the test
# checks as such. An item's own `refused` is a refusal of that item, which
# fills its coordinates; a cell table's `refused` is the deck's, stopped by
# another card, which fills none. Further keys are the grid's own, listed in
# `item_keys`.

[grid.printed-measurement]
question = "What does this log say a measurement's result is."
functions = [
    "lib/log_parser.py:printed_measurements",
    "lib/log_parser.py:printed_form",
    "lib/log_parser.py:parse_measurements",
    "lib/log_parser.py:measurement_cards",
    "lib/log_parser.py:measurement_answer",
    "lib/log_parser.py:answered_measurements",
    "lib/spice_lex_views.py:MeasCard",
]
item_axis = "form"
# Keys of a cell beside its coordinates: the steps, from 1, that an outcome in
# one step concerns; and zero_by_form, for a result that is 0 in every step by
# what its form is where each step has one point (a PP, a derivative, a
# TRIG/TARG at one level, in a stepped .tf). not_a_number: the text the log
# printed where the result's number belongs, a number that is not finite;
# every route gives null and says what was printed. printed_once: the step,
# from 1, whose value a line printed once for a run of several steps holds,
# and how many steps the run had (`of`); every route says both.
item_keys = ["steps", "zero_by_form", "not_a_number", "printed_once"]
groups = [
    ["form", "analysis", "stepped", "outcome"],
    ["name", "printed"],
    ["level", "stepped"],
    ["complex_format"],
    ["card"],
]

[grid.printed-measurement.axis]
# The form of the .meas card: what MeasCard.bare_when tells apart from the
# rest, and what printed_form reads off the line it prints. `find` is a FIND
# with no point, the form a sweepless analysis (.op, .tf) is measured with.
form = { values = ["max", "min", "pp", "avg", "rms", "integ", "find", "find_at", "find_when", "when", "deriv_at", "deriv_when", "trig_targ", "param"], default = "" }
# The analysis the deck runs: an AC and a noise result is complex
# (_complex_measurement), a sweepless one prints a point of its own.
analysis = { values = ["tran", "ac", "dc", "noise", "op", "tf"], default = "" }
# A stepped run prints a table (printed_form's table_* forms) where an
# unstepped one prints a line.
stepped = { values = ["no", "yes"] }
# What the measurement came to: a result in every step, a failure of the whole
# measurement (FAIL'ed), a failure in one step (failed in a row, or XVII's 0:
# answered_measurements' not_established), a result of 0 in one step.
outcome = { values = ["value", "failed", "step_fails", "step_zero"] }
# How the name is spelled: _MEAS_NAME reads a dot or a dash only before ": ";
# names are keyed in lower case; a reserved name is refused.
name = { values = ["plain", "punctuation", "reserved", "upper"], default = "plain" }
# The line the name is printed on: "name: expr=value ...", a TRIG/TARG's
# "name=value FROM a TO b" with no colon, a stepped table's heading, and
# 'Measurement "name" FAIL'ed'.
printed = { values = ["line", "line_bare", "table", "failed"] }
# How a WHEN's level is written: one that is not a number is printed as
# written, which spicelib's reader cuts short or skips (unreadable, skipped).
level = { values = ["number", "parameter", "expression", "braced", "measurement"], default = "" }
# .options meascplxfmt, for a complex (AC) result.
complex_format = { values = ["default", "polar", "cartesian"], default = "" }
# Which card printed the measurement: a .meas, or a stepped .fra run, which
# prints its loop margins as measurement tables (with their units).
card = { values = ["meas", "fra"], default = "meas" }

[[grid.printed-measurement.exclude]]
at = { stepped = ["no"], outcome = ["step_fails", "step_zero"] }
reason = "A run with no .step has one step."

[[grid.printed-measurement.exclude]]
at = { form = ["when"], analysis = ["ac", "noise"], outcome = ["step_zero"] }
reason = "An AC or noise sweep starts above 0 Hz, so a WHEN never crosses at 0."

[[grid.printed-measurement.exclude]]
at = { analysis = ["op", "tf"], outcome = ["step_fails", "step_zero"] }
reason = "A sweepless analysis has one point in each step, so a form over a sweep (PP, a derivative, a TRIG/TARG, a WHEN) comes to 0 or fails in every step, and no card tells a failure or a 0 in one step apart from the form's own; and of a stepped .op, LTspice 26 prints one line, not a table, and XVII prints nothing (log/meas_step_op)."

[[grid.printed-measurement.exclude]]
at = { form = ["find"], outcome = ["step_fails"] }
reason = "A FIND with no point reads the one value its signal has: no card makes it fail in one step and not in another."

# What each form's result is, from what the form means: the value printed
# after "=" or the point printed after AT. In a stepped table each row prints
# the result alone, in its first column, so this says which field of the reply
# holds it only for a line. A .fra margin is the value printed.
[grid.printed-measurement.expect.form]
max = "value"
min = "value"
pp = "value"
avg = "value"
rms = "value"
integ = "value"
find = "value"
find_at = "value"
find_when = "value"
when = "point"
deriv_at = "value"
deriv_when = "value"
trig_targ = "value"
param = "value"

[grid.printed-measurement.expect.card]
fra = "value"

# Recorded cells -----------------------------------------------------------

[[grid.printed-measurement.cell]]
cases = ["log/meas_forms"]
at = { analysis = "tran", stepped = "no", outcome = "value", printed = "line" }
[grid.printed-measurement.cell.items]
m_max = "max"
m_min = "min"
m_pp = "pp"
m_avg = "avg"
m_rms = "rms"
m_integ = "integ"
m_find = "find_at"
m_when = { form = "when", level = "number" }
m_findwhen = "find_when"
m_trigtarg = { form = "trig_targ", printed = "line_bare" }
m_param = "param"
m_deriv = "deriv_at"
m_nokind = "max"
m_expr = "find_at"

[[grid.printed-measurement.cell]]
cases = ["log/meas_ac"]
at = { analysis = "ac", stepped = "no", outcome = "value", printed = "line", complex_format = "default" }
[grid.printed-measurement.cell.items]
g1k = "find_at"
gmax = "max"
fc = { form = "when", level = "number" }
bw = { form = "trig_targ", printed = "line_bare" }

[[grid.printed-measurement.cell]]
cases = ["log/meas_step"]
at = { analysis = "tran", stepped = "yes", outcome = "value", printed = "table" }
[grid.printed-measurement.cell.items]
s_max = "max"
s_avg = "avg"
s_find = "find_at"
s_when = { form = "when", level = "number", outcome = "step_fails", steps = [3] }
s_rise = "trig_targ"
s_param = "param"

# LTspice 26 prints one line for the three steps; XVII prints nothing. The
# line holds the first step's value: raw/step_op runs the same divider over the
# same steps, and its results file holds V(out) 0.8, 1.6 and 2.4 and I(V1)
# -0.2m, -0.4m and -0.6m; the log printed 0.800000011921 and -0.000199999994948
# (test_the_line_a_stepped_op_prints_holds_its_first_steps_value).
[[grid.printed-measurement.cell]]
cases = ["log/meas_step_op"]
at = { analysis = "op", stepped = "yes", outcome = "value", printed = "line" }
[grid.printed-measurement.cell.items]
vout = { form = "find", printed_once = { step = 1, of = 3 }, refused = { ltspice17 = "XVII prints no measurement of a stepped .op." } }
iin = { form = "find", printed_once = { step = 1, of = 3 }, refused = { ltspice17 = "XVII prints no measurement of a stepped .op." } }

[[grid.printed-measurement.cell]]
cases = ["log/meas_deriv_when"]
