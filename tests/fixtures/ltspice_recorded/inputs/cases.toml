source = "deck/solver_default.cir"
ini = { Solver = "2" }

[[case]]
id = "deck/solver_setting_alt"
behaviour = "options-solver"
source = "deck/solver_default.cir"
ini = { Solver = "alt" }

[[case]]
id = "deck/solver_setting_over_norm"
behaviour = "options-solver"
source = "deck/solver_norm.cir"
ini = { Solver = "1" }

