id = "raw/fra_numdgt7"
behaviour = "raw-fra"
source = "raw/fra_numdgt7.cir"
keep = ["log", "raw", "fra_1.raw"]
builds = ["current"]

# The Solver setting, which every other case leaves out. The transient is
# deck/solver_default, so its samples say which solver ran. solver_setting_alt
# gives the setting a word .options takes, and solver_setting_over_norm a deck
# that names the other solver. On LTspice XVII that deck stops at its .options
# line, and a setting of 2 crashes the build, leaving an empty log.
[[case]]
id = "deck/solver_setting_0"
behaviour = "options-solver"
source = "deck/solver_default.cir"
ini = { Solver = "0" }

[[case]]
id = "deck/solver_setting_1"
behaviour = "options-solver"
source = "deck/solver_default.cir"
ini = { Solver = "1" }

[[case]]
