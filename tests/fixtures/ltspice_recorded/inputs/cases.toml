# ---------------------------------------------------------------- grid: how a results file is laid out

[grid.results-layout]
question = "How a results file is laid out, and what its plot is."
# The writer the header names (_resolve_dialect), the byte layout of each
# value and the order the values are stored in (_layout, and the run row's own
# reading of a binary record, raw_parser._binary_layout), the analysis
# (plot_analysis), whether the plot opens with a sampled axis or with the
# stepped values (sampled_axis, leading_parameters), and the kind of stepped
# result (stepped_kind).
functions = [
    "lib/raw_header.py:_resolve_dialect",
    "lib/raw_header.py:_layout",
    "lib/raw_header.py:leading_parameters",
    "lib/raw_parser.py:_binary_layout",
    "lib/result_kinds.py:plot_analysis",
    "lib/result_kinds.py:sampled_axis",
    "lib/result_kinds.py:stepped_kind",
]
item_axis = "analysis"
# Keys of a cell beside its coordinates: steps, how many steps the deck's .step
# cards give it (1 when it names none; a build's count where the recording of
# an .op.raw beside a stepped run shows one); kind, the stepped kind a build's
# recording shows where the form alone does not say (the .op.raw a stepped run
# leaves); not_established, for a form no recording shows, why what the cell
# declares is a prediction; differs, a route that answers otherwise, with the
# reason.
item_keys = ["steps", "kind", "not_established", "differs"]
behaviours = ["raw-transient", "raw-ac", "raw-dc", "raw-noise", "raw-op", "raw-stepped", "raw-transfer-function", "raw-fra", "raw-ascii", "raw-fastaccess", "results-layout-grid"]
groups = [
    ["analysis", "storage", "stepped"],
    ["analysis", "points", "stepped"],
    ["analysis", "numdgt"],
    ["compression"],
    ["analysis", "order"],
    ["file", "stepped"],
]

[grid.results-layout.axis]
# The analysis the plot holds, read off its name (plot_analysis); an .fra run's
# transient raw is a tran, its .fra_1.raw an fra.
analysis = { values = ["tran", "ac", "dc", "noise", "op", "tf", "fra"] }
# Binary values, or text (Values:), which _Scanner.text_payload reads.
storage = { values = ["binary", "text"], default = "binary" }
# What the run steps: nothing, a .param, the temperature (a leading variable
# of type temperature, leading_parameters), a source by its own name, or a
# model parameter. The type a build gives the leading variable of a source or
# a model parameter is what leading_parameters reads.
stepped = { values = ["no", "param", "temp", "source", "model"], default = "no" }
# A frequency or DC sweep over many points, or one: a stepped one-frequency
# plot opens with the stepped values, not a frequency (sampled_axis).
points = { values = ["swept", "one"], default = "" }
# .options numdgt above 6, which writes the double flag (_layout).
numdgt = { values = ["default", "above_6"], default = "default" }
# Waveform compression of a transient, off writing the nocompression flag.
compression = { values = ["on", "off"], default = "" }
# Values stored point by point, or trace by trace after -FastAccess (_layout's
# storage order).
order = { values = ["point", "trace"], default = "point" }
# The run's own results file, or the .op.raw a transient or an AC run leaves
# beside it, whose stepped kind stepped_kind tells by its one point.
file = { values = ["own", "op_beside"], default = "own" }

[[grid.results-layout.exclude]]
at = { analysis = ["tran", "op", "tf", "fra"], points = ["swept", "one"] }
reason = "A transient and a frequency response analysis always sweep, and an operating point and a transfer function are one point: only a frequency sweep and a DC sweep can be one point or many."

[[grid.results-layout.exclude]]
at = { analysis = ["fra"], order = ["trace"] }
reason = "Not recordable as the recorder stands: a fastaccess case converts the run's own <case>.raw with -FastAccess, which for a frequency response analysis is its transient, not the .fra_1.raw. Recording it needs a case kind that converts another file the run wrote."

