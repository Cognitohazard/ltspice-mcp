[grid.printed-measurement.cell.items]
before = "max"
broken = { form = "find_at", refused = { ltspice26 = "LTspice 26 refuses the deck: the card does not parse.", ltspice17 = "XVII reports that the card's FIND cannot be evaluated over an interval and takes the others." } }
after = "min"

[[grid.printed-measurement.cell]]
