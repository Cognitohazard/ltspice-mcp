word = { states = "deck_error", text = { ltspice26 = "cond_grid_model_value_word.cir(5):", ltspice17 = "Error on line 5 : .model dx" }, on = { ltspice26 = { rule = "deck_error.lt26.1" }, ltspice17 = { rule = "deck_error.xvii.1" } }, not_established = "No recording shows XVII's Error on line followed by a line no named rule reads, which is all that rule deck_error.xvii.1 takes; this deck is a guess at one." }

# The step a value belongs to ------------------------------------------------

[grid.step-value]
question = "Which step of a stepped run does this value belong to."
functions = [
    "lib/log_parser.py:read_step_line",
    "lib/log_parser.py:parse_step_iterations",
    "lib/raw_decode.py:_step_facts",
    "lib/step_values.py:step_axis_key",
    "lib/step_values.py:same_step_value",
    "lib/step_values.py:steps_with",
    "lib/step_values.py:step_with",
    "lib/recipes.py:StepSelector",
]
item_axis = "value"
# Keys of a cell beside its coordinates: the axis name a caller passes, as the
# deck spells it; the value as the deck writes it; the steps, from 1, that hold
# it, from the deck's .step cards (each build runs the first card innermost:
# log/step_two_params prints r=1000 and r=2000 under c=1e-07 first; and runs a
# list's values from the lowest up, whatever order the deck writes them in:
# raw/step_digits lists 1k 2.15k 4.64k 100.001 100.002 and prints 100.001
# first); and
# not_established, for a form no recording shows, the reason the steps it
# declares are a prediction the recording settles. differs: a route that
# answers otherwise than the cell, with the reason, pinned in the test.
item_keys = ["axis", "step_value", "steps", "not_established", "differs"]
behaviours = ["raw-stepped", "log-step", "step-value-digits", "step-temp-upper-case", "step-without-values", "step-value-grid"]
groups = [
    ["sweep", "stepped", "nesting"],
    ["value", "kept"],
    ["name_case", "stepped"],
]

[grid.step-value.outside]
"raw/step_tran_op_raw" = "The case keeps only the .op.raw a stepped .tran leaves, the operating point it starts from, which test_recorded_ltspice_results reads; the run's steps are the cells of raw/step_tran, the same deck."
"raw/step_ac_op_raw" = "The case keeps only the .op.raw a stepped .ac leaves, which test_recorded_ltspice_results reads; the run's steps are the cells of raw/step_ac, the same deck."
"deck/step_bare" = "A .step naming nothing steps no value: each build refuses the deck (test_recorded_ltspice_decks), so no value names a step of it."
"deck/step_param_bare" = "A .step param naming no values steps no value: XVII refuses the deck and LTspice 26 prints .step lines with no value (test_recorded_ltspice_decks), so no value names a step of it."

[grid.step-value.axis]
# How the .step card sweeps: a list, or a linear, decade or octave sweep, whose
# values LTspice works out (read_step_line reads the values the log prints).
sweep = { values = ["list", "linear", "decade", "octave"] }
# What is stepped: a .param, the temperature (printed with its unit,
# read_step_line's degree sign; named temperature in a raw, step_axis_key), a
# model parameter, or a source's value.
stepped = { values = ["param", "temp", "model", "source"] }
# How many .step cards the run nests: one, two or three (LTspice's limit).
nesting = { values = ["1", "2", "3"] }
# The value's form: a number of at most six significant digits with no
# suffix, one of more (printed to six, same_step_value), a negative one, zero
# (printed_half_unit), one written with a suffix (step_number), and a
# temperature, printed with the degree sign.
value = { values = ["plain", "many_digits", "negative", "zero", "suffix", "degree"] }
# Where the run keeps its step values: only in the log's .step lines (a
# swept analysis) or in the raw, one point a step (an operating point, an AC
# or noise analysis at one frequency): steps_with prefers a value a step holds
# exactly.
kept = { values = ["log", "raw"] }
# How the .step card spells the name: step_axis_key reads a name in any case.
name_case = { values = ["lower", "mixed", "upper"] }

[[grid.step-value.exclude]]
at = { value = ["degree"], kept = ["raw"] }
reason = "A run that keeps its step values in its raw writes no .step lines, where the degree sign is printed: a stepped temperature's value there is a number (raw/step_temp_op)."

