# ---------------------------------------------------------------- the declaration grid

[grid.declaration]
question = "What a .param, .model or .subckt card declares: the names it sets and the value LTspice gives each."
# The views of the three cards (ParamCard, which reads one assignment;
# ModelCard, its parameters inside parentheses or bare and its level as a
# number; SubcktCard, its ports and the defaults after params: or after its
# first assignment) and the reader of every assignment of a .param card
# (assigned_params).
functions = [
    "lib/spice_lex_views.py:ParamCard",
    "lib/spice_lex_views.py:ModelCard",
    "lib/spice_lex_views.py:SubcktCard",
    "lib/spice_lex_views.py:assigned_params",
]
item_axis = "name"
# Keys of a cell beside its coordinates: the item is the name declared;
# subject, the thing a route reads for it (param, model, level, default);
# via, an element whose value is the declared value, so the routes that
# evaluate an element answer too; node and volts, as the deck-card grid's;
# reads, the reading the form means; not_established; differs.
item_keys = ["subject", "via", "node", "volts", "reads", "not_established", "differs"]
behaviours = ["deck-semantics", "declaration-grid"]
groups = [
    ["param_form"],
    ["model_params"],
    ["model_level"],
    ["subckt_params"],
]

[grid.declaration.outside]
"deck/param_temp" = "A parameter named temp: whether a name sets the temperature, not what the card declares."
"deck/options_temp" = "The temperature an .options card sets: no declaration."
"deck/caret_power" = "What an expression evaluates to: the expression-value grid's."
"deck/subckt_param_precedence" = "Which of a subcircuit's defaults and body .param a name reads: the scope of a name, not what one card declares."

[grid.declaration.axis]
# How a .param card writes its assignments: one, several (the first and a
# later one, which ParamCard does not read), in braces, in quotes, and with
# spaces on both sides of its sign or on one.
param_form = { values = ["one", "several_first", "several_later", "braces", "quotes", "spaced_both", "spaced_before", "spaced_after"], default = "" }
# A .model card's parameters inside parentheses or bare after its type.
model_params = { values = ["parens", "bare"], default = "" }
# A .model card's level as a number, or computed in braces (ModelCard's
# level is None then).
model_level = { values = ["number", "computed"], default = "" }
# A .subckt card's defaults after params:, or after its first assignment
# with no params:.
subckt_params = { values = ["params_marker", "first_assignment"], default = "" }

