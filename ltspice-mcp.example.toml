# LTSpice MCP Server Configuration
# Copy to ltspice-mcp.toml and edit for your environment.
# All settings have sensible defaults and can be overridden with environment variables
# Every key is commented out, showing its default or, where it has none to
# write, an example. Uncomment a line to set it.

[simulator]
# Preferred simulator: ltspice, ngspice, qspice, xyce
# Unset: auto-detect, preferring LTspice when it is found
# default = "ltspice"

# Allowlist of simulators to expose, e.g. ["ltspice", "ngspice"].
# Empty = auto-detect every supported simulator.
# enabled = []

# Explicit path to simulator executable (overrides auto-detection)
# Unset: auto-detect
# path = "C:\\Program Files\\ADI\\LTspice\\LTspice.exe"
# Established native Windows settings for recoverable LTspice runs.
# Unset uses APPDATA/LTspice.ini; the original file is never written.
# ltspice_ini = "C:/SPICE/LTspice.ini"

# On Windows, start LTspice on a desktop of its own, so its window does not
# take the keyboard focus on every run. false shows the window, and any
# message box LTspice stops on, on your own desktop.
# hidden_desktop = true

# ngspice compatibility mode (ngbehavior). Unset = spicelib's default
# 'kiltpsa'; its lt (LTspice) and ps (PSPICE) tokens both break sectioned
# '.lib <file> <section>' PDK corner selection. Set a mode with neither,
# "hsa" or "kia", for standard-SPICE / PDK decks.
# ngbehavior = "hsa"

# More executables of one family, each run by naming it per call as
# execution.simulator = "ltspice:<name>"; the plain family name keeps
# running the one above. The family is read off the file name; when the
# name says nothing, write the key as "family:name". Probed at startup.
# executables = {xvii = "C:/Program Files/LTC/LTspiceXVII/XVIIx64.exe"}

[security]
# Paths accessible to the server (sandbox). Left unset, the default is the
# working directory plus the Claude Code scratch directory, where an agent
# writes its throwaway decks: <tempdir>/claude-<uid> on Linux and macOS,
# %TEMP%\claude on Windows. Set your own list to replace that default;
# the server re-reads this list on the next call after you save the file:
# allowed_paths = ["."]

[simulation]
# Maximum number of concurrent simulations.
# Default: number of CPU cores, capped at 8.
# max_parallel = 4

# Maximum cases after run_experiments variation expansion.
# max_experiment_cases = 1024

# Bound on one LTspice schematic netlist export, in seconds
# timeout = 300.0

# Per-case simulation timeout in seconds when a request sets none.
# Default: no limit. execution.run_timeout_s overrides it.
# run_timeout = 3600

# Preflight size guard, estimated from .tran/.ac/.dc directives.
# Warn when the estimated point count exceeds this:
# max_estimated_points = 20000000
# Refuse a run whose estimated raw (MB, single-trace) exceeds this:
# max_raw_mb = 4096

[analysis]
# Maximum waveform data points to return per trace
# max_points = 10000
# Whole-call work budget for analyze_results, in seconds
# analysis_budget_s = 60.0
# Default response budget in tokens for consolidated calls (0 disables)
# default_budget = 4000
# Retention for raw-path-only analysis result sets, in hours
# result_set_ttl_hours = 24.0
# Open plot_waveform's chart in a local browser window (a call's open wins)
# open_plot = true
# Attach a PNG of plot_waveform's chart for a vision model (needs the
# raster extra; a call's attach_plot wins)
# attach_plot = false

[tools]
# How much of each tool definition the tool list carries. "compact"
# (the default) advertises the tools with the per-argument descriptions
# removed, read on demand through inspect(kind="reference"); "full"
# advertises them as registered. No tool gains or loses a capability.
# listing = "compact"
# run_code = false removes the tool that runs a Python snippet with the engine
# in scope (loops over runs, numpy on samples). The snippet has the server's
# own file and process authority, not the sandbox above: permission it in
# your client the way you would a shell, and turn it off when the server is
# reachable by more than one trusted client, for example through a proxy.
# run_code = true

[schematic]
# Custom paths to LTspice symbol (.asy) files for .asc schematic support
# On Windows and WSL these are auto-detected from the LTspice installation
# Set this to override auto-detection or for non-standard installs
# symbol_paths = ["/path/to/LTspice/lib/sym"]

[logging]
# Stderr logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
# Set "INFO" for the startup banner and per-run detail.
# level = "WARNING"

[state]
# Persist experiment job records to .ltspice-mcp/experiments/ in the working
# directory.
# Lets a restarted server surface prior runs and recent circuits; set to false to disable.
# persist_jobs = true
# preload_recent_count: at startup, eagerly load persisted jobs for this many recently-touched circuits. 0 disables preload (lazy-only).
# preload_recent_count = 10
