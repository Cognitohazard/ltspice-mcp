# LTSpice MCP Server Configuration
# Copy to ltspice-mcp.toml and edit for your environment.
# Each setting has a default, and an environment variable can override it.
# Every key is commented out and shows its default, or an example where there
# is no default to write. Uncomment a line to set it.

[simulator]
# Preferred simulator: ltspice, ngspice, qspice, xyce
# Unset: auto-detect, preferring LTspice when it is found
# default = "ltspice"

# Allowlist of simulators to expose, e.g. ["ltspice", "ngspice"].
# Empty = auto-detect every supported simulator.
# enabled = []

# Explicit path to simulator executable (overrides auto-detection)
# Unset: auto-detect
# path = "C:\\Program Files\\ADI\\LTspice\\LTspice.exe"
# LTspice.ini whose settings recoverable LTspice runs use (native Windows).
# Each run gets a private copy, so this file is never changed.
# Unset: %APPDATA%/LTspice.ini.
# ltspice_ini = "C:/SPICE/LTspice.ini"

# On Windows, start LTspice on a desktop of its own, so its window does not
# take the keyboard focus on every run. Set false to show the window, and
# any message box that stops LTspice, on your own desktop.
# hidden_desktop = true

# ngspice compatibility mode (ngbehavior). Unset = spicelib's default
# 'kiltpsa'; its lt (LTspice) and ps (PSPICE) tokens both break sectioned
# '.lib <file> <section>' PDK corner selection. Set a mode with neither,
# "hsa" or "kia", for standard-SPICE / PDK decks.
# ngbehavior = "hsa"

# Additional executables of one simulator family. Select one per call with
# execution.simulator = "ltspice:<name>"; the plain family name still runs
# the executable above. The family is taken from the file name. If the file
# name does not identify it, write the key as "family:name". Each executable
# is probed at startup.
# executables = {xvii = "C:/Program Files/LTC/LTspiceXVII/XVIIx64.exe"}

[security]
# Sandbox. Every path given to a tool must be inside one of these
# directories. If unset (the default), there is no sandbox and a path may
# name any file this process can open. When the list is set, a relative path
# is resolved against its first entry. The list does not confine run_code,
# so also set [tools] run_code = false to keep a client inside these
# directories. The server reads the list again on the next call after you
# save the file.
# allowed_paths = ["."]

[simulation]
# Maximum number of concurrent simulations.
# Default: number of CPU cores, capped at 8.
# max_parallel = 4

# Maximum cases after run_experiments variation expansion.
# max_experiment_cases = 1024

# Time limit, in seconds, for LTspice to export one schematic's netlist
# timeout = 300.0

# Per-case simulation timeout in seconds when a request sets none.
# Default: no limit. execution.run_timeout_s overrides it.
# run_timeout = 3600

# Before a run, the server estimates its output size from the .tran, .ac
# and .dc directives. It warns when the estimated point count exceeds
# max_estimated_points.
# max_estimated_points = 20000000
# It refuses a run whose estimated raw file exceeds max_raw_mb megabytes.
# The estimate counts one trace, so a real raw file is larger.
# max_raw_mb = 4096

[analysis]
# Maximum waveform data points to return per trace
# max_points = 10000
# Whole-call work budget for analyze_results, in seconds
# analysis_budget_s = 60.0
# Default response budget, in tokens, for run_experiments, jobs,
# analyze_results and inspect replies (0 disables)
# default_budget = 4000
# Hours to keep an analyze_results result set whose sources are all
# files named by path. A result set read from jobs is kept as long as its jobs.
# result_set_ttl_hours = 24.0
# Open plot_waveform's chart in a local browser window (a call's open wins)
# open_plot = true
# Attach a PNG of plot_waveform's chart for a vision model (needs the
# raster extra; a call's attach_plot wins)
# attach_plot = false

[tools]
# How much of each tool definition the tool list includes. "compact"
# (the default) advertises the tools with the per-argument descriptions
# removed, read on demand through inspect(kind="reference"); "full"
# advertises them as registered. Both give the same capabilities.
# listing = "compact"
# run_code = false removes the tool that runs a Python snippet with the
# Python API in scope (loops over runs, numpy on samples). The snippet has
# the server's own file and process authority, which allowed_paths does not
# confine. Approve it in your client as you would a shell command, and turn
# it off when the server is reachable by more than one trusted client, for
# example through a proxy.
# run_code = true

[schematic]
# Custom paths to LTspice symbol (.asy) files for .asc schematic support
# On Windows and WSL these are auto-detected from the LTspice installation
# Set this to override auto-detection or for non-standard installs
# symbol_paths = ["/path/to/LTspice/lib/sym"]

# Show each edit_schematic change in the LTspice window that has the sheet
# open, and refuse an edit while that window has unsaved changes. Needs
# Windows and LTspice 26.1 or later; LTspice is never started for it. Set
# false to leave LTspice windows unchanged.
# sync_open_window = true

# Start LTspice when asked to show a sheet or a run in it and no LTspice
# window is open. It opens in view and takes the keyboard focus. Set false
# to show sheets and runs only in a window that is already open.
# start_ltspice = true

[logging]
# Stderr logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
# Set "INFO" for the startup banner and per-run detail.
# level = "WARNING"

[state]
# Persist experiment job records to .ltspice-mcp/experiments/ in the working
# directory.
# A restarted server can then list earlier runs and recent circuits. Set false
# to disable.
# persist_jobs = true
# At startup, load the saved jobs of this many recently used circuits.
# 0 disables preloading, so jobs load only when they are requested.
# preload_recent_count = 10
