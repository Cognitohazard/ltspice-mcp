# LTSpice MCP Server Configuration
# Copy to ltspice-mcp.toml and edit for your environment.
# All settings have sensible defaults and can be overridden with
# LTSPICE_MCP_* environment variables.

[simulator]
# Preferred (default) simulator: ltspice, ngspice, qspice, xyce
# Leave empty for auto-detection (prefers LTSpice if available)
default = "ltspice"

# Allowlist of simulators to expose. Empty = auto-detect every supported one.
# When set, only the listed simulators are probed/exposed.
# Example: enabled = ["ltspice", "ngspice"]
enabled = []

# Explicit path to simulator executable (overrides auto-detection).
# A valid path here suppresses auto-detection for that simulator.
# Leave empty for auto-detection. On WSL the standard Windows install
# locations are auto-detected, so a path is no longer strictly required.
# Examples:
#   WSL:     "/mnt/c/Users/<you>/AppData/Local/Programs/ADI/LTspice/LTspice.exe"
#   Windows: "C:\\Program Files\\ADI\\LTspice\\LTspice.exe"
#   Linux:   "" (auto-detect via Wine or PATH)
path = ""

# ngspice compatibility mode passed as `-D ngbehavior=<mode>`.
# Leave unset to keep spicelib's default ("kiltpsa"). That default's `lt`/`ps`
# tokens make ngspice read a sectioned `.lib <file> <section>` (the PDK corner
# idiom) as two plain includes and drop the section — set a mode with neither
# token (e.g. "hsa") if a sectioned .lib must parse. Only affects ngspice.
# ngbehavior = "hsa"

[security]
# Paths accessible to the server (sandbox)
# Default: ["."] (current working directory)
allowed_paths = ["."]

[simulation]
# Maximum number of concurrent simulations.
# Default: number of CPU cores, capped at 8. Uncomment to override.
# max_parallel = 4

# Default simulation timeout in seconds
timeout = 300.0

[analysis]
# Maximum waveform data points to return per trace
max_points = 10000

[logging]
# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

[schematic]
# Additional paths to .asy symbol files (auto-detected on Windows/WSL)
symbol_paths = []

[tools]
# Tool profile: "full" (all tools) or "agentic" (reduced set for capable LLM agents)
profile = "full"

[state]
# Persist simulation/batch job metadata to .ltspice-mcp/jobs/ next to each
# circuit, so a restarted server can surface prior runs.
persist_jobs = true

# At startup, eagerly load persisted jobs for this many recently-touched
# circuits. 0 disables preload (lazy loading on first tool call).
preload_recent_count = 10
